      Daraus entstehen Historie und Durchlaufzeiten, ohne zusätzliche Eingabe.</p></div>
    <div class="flat pad"><h3>Fristen entstehen von selbst</h3>
      <p class="tiny muted" style="margin:6px 0 0">Jede Frist hängt an dem Datum, das sie auslöst.
      <b>${VORLAUF_ABNAHME} Tage vor der Wohnungsabgabe</b> wird «Abnahmetermin vereinbaren» fällig.
      «Handwerker aufbieten» bekommt seine Frist erst mit der <b>durchgeführten Abnahme</b> und läuft dann
      ${FRIST_HANDWERKER} Tage – vorher ist ja nicht bekannt, was zu beauftragen ist.
      Ein eigener Termin überschreibt die Sollfrist immer.</p></div>
    <div class="flat pad"><h3>Drei Zustände statt Ja/Nein</h3>
      <p class="tiny muted" style="margin:6px 0 0">Ein Schritt ist <b>offen</b>, <b>erledigt</b> oder <b>nicht erforderlich</b>.
      Damit ist «bewusst übersprungen» von «noch nicht angefasst» unterscheidbar – im Excel hiess beides «Nein».</p></div>
    <div class="flat pad"><h3>Leerstand ab dem Tag nach der Haftung</h3>
      <p class="tiny muted" style="margin:6px 0 0">Das Haftungsdatum ist der letzte Tag des Vormieters; gezählt wird ab dem Folgetag,
      einschliesslich des letzten leeren Tages. Haftung bis 31.08. und Vermietung ab 01.09. ergeben 0 Leerstandstage.
      Die Kündigungsfrist davor erscheint getrennt als Vorlaufzeit.</p></div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <header><span class="lbl">Prüfungen, die laufend im Hintergrund laufen</span></header>
    <div class="warn-list">
      <div class="wrow crit"><span class="ic">!</span><div><b class="f-ui" style="font-size:13.5px">Verstrichene Termine</b>
        <div class="w2">WA-Termin, Vertragsrücklauf und Schlüsselübergabe – im Excel wurde nur der WA-Termin geprüft.</div></div><span></span></div>
      <div class="wrow crit"><span class="ic">!</span><div><b class="f-ui" style="font-size:13.5px">Überschrittene Sollfristen</b>
        <div class="w2">Abnahmetermin ${VORLAUF_ABNAHME} Tage vor der Wohnungsabgabe, Handwerkeraufgebot ${FRIST_HANDWERKER} Tage nach der Abnahme – im Excel gar nicht vorhanden.</div></div><span></span></div>
      <div class="wrow crit"><span class="ic">!</span><div><b class="f-ui" style="font-size:13.5px">Zwei offene Fälle zum selben Objekt</b>
        <div class="w2">Wird beim Anlegen gemeldet, nicht erst als Farbe in der Liste.</div></div><span></span></div>
      <div class="wrow warn"><span class="ic">▲</span><div><b class="f-ui" style="font-size:13.5px">Unplausible Daten</b>
        <div class="w2">Haftungsdatum vor Kündigung, Vermietung vor Leerstandsbeginn, WA-Termin vor Kündigung.</div></div><span></span></div>
      <div class="wrow warn"><span class="ic">▲</span><div><b class="f-ui" style="font-size:13.5px">Fehlende Pflichtangaben</b>
        <div class="w2">Je Phase nur das, was in dieser Phase wirklich gebraucht wird.</div></div><span></span></div>
      <div class="wrow warn"><span class="ic">▲</span><div><b class="f-ui" style="font-size:13.5px">Langläufer über 60 Tage</b>
        <div class="w2">Gerechnet ab Haftungsdatum – dadurch schlägt die Warnung nicht mehr bei planmässigen Fällen an.</div></div><span></span></div>
      <div class="wrow info"><span class="ic">i</span><div><b class="f-ui" style="font-size:13.5px">Abschlussbereitschaft</b>
        <div class="w2">Ein Fall lässt sich erst schliessen, wenn die Schlussabrechnung bezahlt ist.</div></div><span></span></div>
    </div>
  </div>

  <div class="panel">
    <header><span class="lbl">Wo jede Excel-Spalte geblieben ist</span>
      <span class="tiny muted">${MAPPING.length} Einträge</span></header>
    <div class="tablewrap"><table>
      <thead><tr><th>Spalte</th><th>Überschrift im Excel</th><th style="white-space:normal">In der Anwendung</th></tr></thead>
      <tbody>${MAPPING.map(m=>`<tr><td class="nr">${esc(m[0])}</td><td>${esc(m[1])}</td>
        <td style="white-space:normal">${esc(m[2])}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>

  <p class="note" style="margin-top:14px">Prototyp mit Demodaten. Die Daten liegen nur in diesem Browser;
    «Demodaten zurücksetzen» in der linken Leiste stellt den Ausgangszustand wieder her.</p>`;
}

/* ============================================================
   14 · DIALOGE: NEUER FALL, EXPORT
   ============================================================ */
function schliesseModal(){ document.getElementById("modalHost").innerHTML=""; }
function zeigeModal(html){
  document.getElementById("modalHost").innerHTML=
    '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  const first=document.querySelector("#modalHost input,#modalHost select");
  if(first) first.focus();
}
function dialogNeuerFall(){
  zeigeModal(`<div class="box">
    <header><h2>Neuer Leerstandsfall</h2><button class="btn ghost sm" data-cancel>Abbrechen</button></header>
    <div class="pad stack">
      <div id="nfDup"></div>
      <div class="grid2">
        <div class="field"><label for="nfObj">Objekt <span class="req">*</span> ${hilfeBtn("objekt")}</label>
          <select id="nfObj"><option value="">bitte wählen …</option>
          ${LIEGENSCHAFTEN.map(l=>`<optgroup label="${esc(l.name)}, ${esc(l.ort)}">
            ${OBJEKTE.filter(o=>o.lig===l.id).map(o=>`<option value="${o.id}">${esc(o.nr)} · ${esc(o.stock)} · ${o.zi.toFixed(1).replace(".",",")} Zi.</option>`).join("")}
          </optgroup>`).join("")}</select>
          <div class="helptext" id="hlp_objekt" hidden>${esc(FELDHILFE.objekt)}</div></div>
        <div class="field"><label for="nfBew">Bewirtschafter <span class="req">*</span> ${hilfeBtn("bewirtschafter")}</label>
          <select id="nfBew">${BEWIRTSCHAFTER.map(b=>`<option ${b===ST.ich?"selected":""}>${b}</option>`).join("")}</select>
          <div class="helptext" id="hlp_bewirtschafter" hidden>${esc(FELDHILFE.bewirtschafter)}</div></div>
        <div class="field"><label for="nfEx">ex-Mieter <span class="req">*</span> ${hilfeBtn("exMieter")}</label>
          <input id="nfEx" type="text" placeholder="Name des kündigenden Mieters">
          <div class="helptext" id="hlp_exMieter" hidden>${esc(FELDHILFE.exMieter)}</div></div>
        <div class="field"><label for="nfSeit">Mieter seit ${hilfeBtn("mieterSeit")}</label>
          <input id="nfSeit" type="date">
          <div class="helptext" id="hlp_mieterSeit" hidden>${esc(FELDHILFE.mieterSeit)}</div></div>
        <div class="field"><label for="nfKue">gekündigt per <span class="req">*</span> ${hilfeBtn("gekuendigtPer")}</label>
          <input id="nfKue" type="date" value="${iso(HEUTE)}">
          <div class="helptext" id="hlp_gekuendigtPer" hidden>${esc(FELDHILFE.gekuendigtPer)}</div></div>
        <div class="field"><label for="nfHaft">Haftungsdatum <span class="req">*</span> ${hilfeBtn("haftungsdatum")}</label>
          <input id="nfHaft" type="date">
          <div class="helptext" id="hlp_haftungsdatum" hidden>${esc(FELDHILFE.haftungsdatum)}</div></div>
      </div>
      <div id="nfErr"></div>
      <p class="note">Mehr braucht es zum Anlegen nicht – dieses Tool führt keine Mieter- oder Objektdaten,
        es überwacht nur die Pendenzen. Im Betrieb entsteht der Fall automatisch, sobald die Kündigung in
        Garaio REM erfasst ist; die Handerfassung bleibt als Rückfallebene.</p>
    </div>
    <footer><button class="btn" data-cancel>Abbrechen</button>
      <button class="btn pri" id="nfSave">Fall anlegen</button></footer>
  </div>`);
}
function pruefeNeu(){
  const objId=document.getElementById("nfObj").value;
  const box=document.getElementById("nfDup");
  const off=FAELLE.filter(f=>f.objektId===objId && !f.abgeschlossen);
  if(objId && off.length){
    box.innerHTML=`<div class="banner crit"><span>!</span><div><b>Zu diesem Objekt ist bereits ein Fall offen.</b><br>
      ${off.map(f=>esc(f.id)+" ("+esc(f.bewirtschafter)+", Phase "+aktuellePhase(f)+", ex "+esc(f.exMieter)+")").join("<br>")}<br>
      Bitte prüfen, ob der bestehende Fall gemeint ist – sonst entsteht eine Doppelerfassung.</div></div>`;
  } else if(objId){
    const alt=FAELLE.filter(f=>f.objektId===objId && f.abgeschlossen);
    box.innerHTML = alt.length? `<div class="banner info"><span>ℹ</span><div>Zu diesem Objekt gibt es
      ${alt.length} abgeschlossene${alt.length===1?"n Fall":" Fälle"} – das ist normal und kein Duplikat.</div></div>` : "";
  } else box.innerHTML="";
}
function speichereNeu(){
  if(!darfAnlegen()){ toast("Keine Berechtigung, Fälle anzulegen."); return; }
  const objId=document.getElementById("nfObj").value;
  const bew=document.getElementById("nfBew").value;
  const ex=document.getElementById("nfEx").value.trim();
  const kue=document.getElementById("nfKue").value;
  const haft=document.getElementById("nfHaft").value;
  const seit=document.getElementById("nfSeit").value;
  const errs=[];
  if(!objId) errs.push("Bitte ein Objekt wählen.");
  if(!ex) errs.push("Bitte den ex-Mieter erfassen.");
  if(!kue) errs.push("Bitte «gekündigt per» erfassen.");
  if(!haft) errs.push("Bitte das Haftungsdatum erfassen – ohne dieses Datum lässt sich der Leerstand nicht berechnen.");
  if(kue&&haft&&diffT(kue,haft)<0) errs.push("Das Haftungsdatum liegt vor dem Kündigungsdatum. Bitte beide Daten prüfen.");
  if(seit&&kue&&diffT(seit,kue)<0) errs.push("«Mieter seit» liegt nach dem Kündigungsdatum. Bitte prüfen.");
  const box=document.getElementById("nfErr");
  if(errs.length){ box.innerHTML='<div class="banner warn"><span>▲</span><div>'+errs.map(esc).join("<br>")+'</div></div>'; return; }
  const jahr=HEUTE.getUTCFullYear();
  const nrs=FAELLE.map(f=>parseInt((f.id.split("-")[2]||"0"),10)).filter(n=>!isNaN(n));
  const id="F-"+jahr+"-"+String(Math.max(0,...nrs)+1).padStart(3,"0");
  const schritte={};
  SCHRITTE.forEach(s=>{ schritte[s.k]={status:"offen",datum:null,von:null,grund:null,termin:null}; });
  const f={id, objektId:objId, bewirtschafter:bew, exMieter:ex, gekuendigtPer:kue, haftungsdatum:haft,
    mieterSeit:seit, neuerMieter:"", vermietetPer:"", notiz:"", schritte,
    historie:[{d:iso(HEUTE), von:ST.ich, txt:"Fall angelegt"}], abgeschlossen:null, angelegtAm:iso(HEUTE)};
  FAELLE.unshift(f);
  schliesseModal();
  ST.nav="fall"; ST.fallId=id;
  speichern(); render(); toast("Fall "+id+" angelegt");
}
function dialogExport(){
  const list=gefiltert();
  const kopf=["Fall-Nr","Obj.-Nr.","Liegenschaft","Ort","Stock","Zimmer","Eigentümer","Bewirtschafter",
    "ex Mieter","gekündigt per","Haftungsdatum","neuer Mieter","Vermietet per","Phase","Status",
    "Leerstandstage","Vorlauftage","Berichtsmonat","offene Schritte"];
  const zeilen=list.map(f=>{
    const o=objekt(f.objektId), l=lig(o.lig), ls=leerstand(f);
    const offen=SCHRITTE.filter(s=>f.schritte[s.k].status==="offen").length;
    return [f.id,o.nr,l.name,l.ort,o.stock,o.zi.toFixed(1).replace(".",","),l.eig,f.bewirtschafter,
      f.exMieter,fmt(f.gekuendigtPer),fmt(f.haftungsdatum),f.neuerMieter,fmt(f.vermietetPer),
      f.abgeschlossen?"–":aktuellePhase(f), f.abgeschlossen?"abgeschlossen":(istUeberfaellig(f)?"überfällig":"offen"),
      ls?ls.tage:"", vorlauftage(f)==null?"":vorlauftage(f), berichtsmonat(f.haftungsdatum), offen];
  });
  const csv=[kopf].concat(zeilen).map(r=>r.map(c=>String(c==null?"":c)).join(";")).join("\n");
  zeigeModal(`<div class="box">
    <header><h2>Export</h2><button class="btn ghost sm" data-cancel>Schliessen</button></header>
    <div class="pad stack">
      <div class="banner info"><span>ℹ</span><div>${list.length} Fälle nach den aktuellen Filtern.
        In der produktiven Anwendung ist das ein Download als Excel- oder PDF-Datei; im Prototyp
        steht der Inhalt hier zum Kopieren.</div></div>
      <textarea id="exTxt" rows="11" readonly aria-label="Exportdaten">${esc(csv)}</textarea>
    </div>
    <footer><button class="btn" data-cancel>Schliessen</button>
      <button class="btn pri" id="exCopy">In Zwischenablage kopieren</button></footer>
  </div>`);
}

/* ============================================================
   15 · RENDERING & NAVIGATION
   ============================================================ */
// Ein Feld kann in einer zugeklappten Phase liegen – erst aufklappen, dann anspringen.
function zeigeFeld(id, picker){
  const el=document.getElementById(id); if(!el) return;
  const d=el.closest("details.phase"); if(d) d.open=true;
  el.scrollIntoView({block:"center", behavior:"smooth"});
  el.focus();
  if(picker && el.showPicker) try{ el.showPicker(); }catch(_){}
}
let letzteAnsicht="";
function render(){
  const v=document.getElementById("view");
  let html="";
  if(ST.nav==="dashboard")        html=viewDashboard();
  else if(ST.nav==="bereich")     html=viewBereich();
  else if(ST.nav==="mitarbeiter") html=ST.mitarbeiter?viewMitarbeiter():viewDashboard();
  else if(ST.nav==="faelle")      html=viewFaelle();
  else if(ST.nav==="fall")        html=viewFall();
  else if(ST.nav==="auswertung")  html=viewAuswertung();
  else if(ST.nav==="stammdaten")  html=viewStammdaten();
  else if(ST.nav==="hilfe")       html=viewHilfe();
  const key=[ST.nav,ST.fallId||"",ST.bereich||"",ST.mitarbeiter||""].join("|");
  const wechsel = key!==letzteAnsicht;
  v.innerHTML=html;
  const aktiv = ST.nav==="fall" ? "faelle" : ST.nav==="mitarbeiter" ? "dashboard" : ST.nav;
  document.querySelectorAll("#rail [data-nav]").forEach(b=>{
    if(b.dataset.nav===aktiv) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  document.querySelectorAll("#rail [data-bereich]").forEach(b=>{
    if(ST.nav==="bereich" && b.dataset.bereich===ST.bereich) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  const zaehlBasis = istLeitung() ? FAELLE : sichtFaelle();
  BEREICHE.forEach(b=>{
    const el=document.querySelector('#rail [data-cnt="'+b.k+'"]');
    if(!el) return;
    const z=bereichZahlen(zaehlBasis,b.k);
    el.textContent = z.faelle||"";
    el.className = "cnt"+(z.dringend?" crit":"");
  });
  const us=document.getElementById("userSel");
  const soll=benutzerliste().map(b=>b.name).join("|");
  if(us.dataset.stand!==soll){
    us.dataset.stand=soll;
    us.innerHTML=benutzerliste().map(b=>
      '<option value="'+esc(b.name)+'">'+esc(b.name)+" — "+ROLLEN[b.rolle].t+'</option>').join("");
  }
  us.value=ST.ich;
  document.getElementById("btnNeu").hidden = !darfAnlegen();
  const ueb=sichtFaelle().filter(f=>!f.abgeschlossen&&istUeberfaellig(f)).length;
  const badge=document.getElementById("railBadge");
  badge.textContent=ueb; badge.hidden = ueb===0;
  const gq=document.getElementById("gq");
  if(document.activeElement!==gq) gq.value=ST.q;
  if(wechsel){ window.scrollTo(0,0); letzteAnsicht=key; }
}
function geheZu(nav,fallId){
  ST.nav=nav; if(fallId!==undefined) ST.fallId=fallId;
  render();
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("button,a,[data-mitarbeiter]"); if(!t) return;

  if(t.dataset.hilfe!==undefined){
    const bereich=t.closest(".modal")||document;
    const box=bereich.querySelector("#hlp_"+CSS.escape(t.dataset.hilfe));
    if(box){ box.hidden=!box.hidden; t.setAttribute("aria-expanded", String(!box.hidden)); }
    return;
  }
  if(t.dataset.cancel!==undefined){ schliesseModal(); return; }
  if(t.dataset.nav){ geheZu(t.dataset.nav); return; }
  if(t.dataset.setbew){ ST.fBew=t.dataset.setbew; ST.fStatus="offen"; geheZu("faelle"); return; }
  if(t.dataset.navTo){ geheZu(t.dataset.navTo); return; }
  if(t.dataset.bereich){ ST.nav="bereich"; ST.bereich=t.dataset.bereich; render(); return; }
  if(t.dataset.mitarbeiter){ ST.nav="mitarbeiter"; ST.mitarbeiter=t.dataset.mitarbeiter; render(); return; }
  if(t.dataset.mitarbeiterWeg!==undefined){ ST.mitarbeiter=null; render(); return; }
  if(t.dataset.q){ queueSpringe(Number(t.dataset.q)); return; }
  if(t.dataset.qend!==undefined){ queueBeenden("Durcharbeiten beendet."); return; }
  if(t.dataset.defer){ zurueckstellen(t.dataset.defer,3); return; }
  if(t.dataset.wvweg){ wiedervorlageAufheben(t.dataset.wvweg); return; }
  if(t.dataset.open){ geheZu("fall", t.dataset.open); return; }
  if(t.dataset.sicht){ ST.sicht=t.dataset.sicht; speichern(); render(); return; }
  if(t.dataset.basis){ ST.basis=t.dataset.basis; speichern(); render();
    toast("Zählung ab dem Tag nach "+(ST.basis==="haftung"?"dem Haftungsdatum":"«gekündigt per»")); return; }
  if(t.dataset.do){ erledigen(t.dataset.fall, t.dataset.do); return; }
  if(t.dataset.na){ const s=SCHRITT[t.dataset.na];
    nichtErforderlich(t.dataset.fall, t.dataset.na, s.naGrund||"Entscheid: nicht erforderlich"); return; }
  if(t.dataset.undo){ zuruecksetzen(t.dataset.fall, t.dataset.undo); return; }
  if(t.dataset.close){ abschliessen(t.dataset.close); return; }
  if(t.dataset.reopen){ wiederOeffnen(t.dataset.reopen); return; }
  if(t.dataset.focus || t.dataset.feldEdit){
    zeigeFeld("fl_"+(t.dataset.focus||t.dataset.feldEdit));
    return;
  }
  if(t.dataset.terminFocus){ zeigeFeld("trm_"+t.dataset.terminFocus, true); return; }

  switch(t.id){
    case "btnQueue": {
      let liste, herkunft;
      if(ST.nav==="bereich"){
        liste=aufgaben(ST.mitarbeiter?faelleVon(ST.mitarbeiter):sichtFaelle(),{bereich:ST.bereich});
        herkunft={nav:"bereich", bereich:ST.bereich, mitarbeiter:ST.mitarbeiter};
      } else if(ST.nav==="mitarbeiter"){
        liste=aufgaben(faelleVon(ST.mitarbeiter));
        herkunft={nav:"mitarbeiter", mitarbeiter:ST.mitarbeiter};
      } else {
        liste=aufgaben(istLeitung()?FAELLE:sichtFaelle());
        herkunft={nav:"dashboard"};
      }
      starteQueue(liste, herkunft); return;
    }
    case "btnNeu": case "btnNeu2": dialogNeuerFall(); return;
    case "btnExport": dialogExport(); return;
    case "nfSave": speichereNeu(); return;
    case "exCopy": {
      const ta=document.getElementById("exTxt");
      ta.select();
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Exportdaten kopiert"),()=>toast("Bitte mit Strg+C kopieren"));
      else toast("Bitte mit Strg+C kopieren");
      return;
    }
    case "btnFilterReset": ST.q=""; ST.fBew=""; ST.fPhase=""; ST.fStatus="offen"; ST.fUeber=false; render(); return;
    case "btnAddBew": {
      const inp=document.getElementById("newBew"), name=inp.value.trim();
      if(!name){ toast("Bitte einen Namen erfassen."); inp.focus(); return; }
      if(BEWIRTSCHAFTER.includes(name)){ toast("Diesen Bewirtschafter gibt es bereits."); return; }
      BEWIRTSCHAFTER.push(name); render(); toast(name+" aufgenommen – ohne Formelumbau.");
      return;
    }
    case "btnReset": {
      if(confirm("Alle Änderungen verwerfen und die Demodaten neu laden?")){
        FAELLE=demodaten(); ST.fallId=null; ST.nav="dashboard"; speichern(); render(); toast("Demodaten zurückgesetzt");
      }
      return;
    }
  }
});

document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset && el.dataset.feld){ setFeld(el.dataset.fall, el.dataset.feld, el.value); return; }
  if(el.dataset && el.dataset.termin){ setTermin(el.dataset.fall, el.dataset.termin, el.value); return; }
  switch(el.id){
    case "userSel": anmelden(el.value); return;
    case "zustaendig": zuweisen(el.dataset.fall, el.value); return;
    case "fbew": ST.fBew=el.value; render(); return;
    case "fph":  ST.fPhase=el.value; render(); return;
    case "fst":  ST.fStatus=el.value; render(); return;
    case "fue":  ST.fUeber=el.checked; render(); return;
    case "nfObj": pruefeNeu(); return;
  }
});

let sucheT=null;
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="gq"){
    ST.q=el.value;
    clearTimeout(sucheT);
    sucheT=setTimeout(()=>{ if(ST.nav!=="faelle"){ ST.nav="faelle"; } render(); el.focus(); }, 220);
    return;
  }
  if(el.id==="fq"){
    ST.q=el.value;
    clearTimeout(sucheT);
    sucheT=setTimeout(()=>{
      const pos=el.selectionStart; render();
      const neu=document.getElementById("fq");
      if(neu){ neu.focus(); try{ neu.setSelectionRange(pos,pos); }catch(_){} }
    }, 220);
    return;
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && document.querySelector("#modalHost .modal")) schliesseModal();
});

/* ---------- Start ---------- */
laden();
render();
</script>
