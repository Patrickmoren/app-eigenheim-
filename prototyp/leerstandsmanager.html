<title>Leerstandsmanager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F4F6F7; --surface:#FFFFFF; --surface-2:#FAFBFB; --sunken:#EDF1F2;
  --ink:#15202A; --ink-2:#5A6B76; --ink-3:#85939C;
  --line:#DFE5E8; --line-strong:#C6D0D5;
  --accent:#0F5C6E; --accent-ink:#0B4655; --accent-soft:#E2EFF2; --on-accent:#FFFFFF;
  --ok:#2F6B45; --ok-soft:#E3F0E8;
  --warn:#8A5A0B; --warn-soft:#FAEEDA;
  --crit:#A3312B; --crit-soft:#F8E4E2;
  --ph1:#CFE3E8; --ph2:#A3CBD4; --ph3:#6FAEBC; --ph4:#3D8B9D; --ph5:#17657A;
  --ph-ink-light:#0B4655; --ph-ink-dark:#FFFFFF;
  --shadow:0 1px 2px rgba(21,32,42,.06), 0 4px 14px rgba(21,32,42,.05);
  --r:6px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0F161D; --surface:#18212B; --surface-2:#1C2631; --sunken:#131C24;
  --ink:#E7EDF1; --ink-2:#9AAAB5; --ink-3:#71828D;
  --line:#2A3743; --line-strong:#3A4A57;
  --accent:#5CBCCE; --accent-ink:#8FD5E2; --accent-soft:#16333C; --on-accent:#08222A;
  --ok:#7BC496; --ok-soft:#1A3326;
  --warn:#E0A950; --warn-soft:#382A12;
  --crit:#EB8B83; --crit-soft:#3A1E1C;
  --ph1:#22424E; --ph2:#2D5F6F; --ph3:#3E8296; --ph4:#59A6B8; --ph5:#8ACDD9;
  --ph-ink-light:#D6EAF0; --ph-ink-dark:#08222A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#0F161D; --surface:#18212B; --surface-2:#1C2631; --sunken:#131C24;
  --ink:#E7EDF1; --ink-2:#9AAAB5; --ink-3:#71828D;
  --line:#2A3743; --line-strong:#3A4A57;
  --accent:#5CBCCE; --accent-ink:#8FD5E2; --accent-soft:#16333C; --on-accent:#08222A;
  --ok:#7BC496; --ok-soft:#1A3326;
  --warn:#E0A950; --warn-soft:#382A12;
  --crit:#EB8B83; --crit-soft:#3A1E1C;
  --ph1:#22424E; --ph2:#2D5F6F; --ph3:#3E8296; --ph4:#59A6B8; --ph5:#8ACDD9;
  --ph-ink-light:#D6EAF0; --ph-ink-dark:#08222A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.f-ui{font-family:Archivo,"Segoe UI",system-ui,sans-serif;text-wrap:balance}
h1{font-size:23px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.mono,.nr{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-family:Archivo;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--ink-3)}
.gsearch{position:relative;flex:0 1 300px;min-width:170px}
.gsearch input[type=text]{width:100%;padding:7px 10px 7px 28px}
.gsearch::before{content:"";position:absolute;left:9px;top:50%;width:11px;height:11px;margin-top:-7px;border:1.6px solid var(--ink-3);border-radius:50%}
.gsearch::after{content:"";position:absolute;left:18px;top:50%;width:6px;height:1.6px;margin-top:2px;background:var(--ink-3);transform:rotate(45deg)}
.main{display:grid;grid-template-columns:214px minmax(0,1fr);flex:1;align-items:start}
.rail{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.rail button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border:0;border-radius:var(--r);background:none;color:var(--ink-2);
  font-family:Archivo;font-size:13.5px;font-weight:500;cursor:pointer;
}
.rail button:hover{background:var(--sunken);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail .dot{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--crit);color:#fff;border-radius:9px;padding:1px 6px}
.rail hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.view{padding:22px 24px 64px;max-width:1180px;min-width:0}
@media (max-width:880px){
  .main{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .rail button{width:auto;white-space:nowrap}
  .rail hr{display:none}
  .view{padding:18px 16px 56px}
}

.userbox{display:flex;flex-direction:column;gap:2px;min-width:0}
.userbox select{padding:4px 7px;font-size:12.5px;max-width:230px;
  font-family:Archivo,system-ui,sans-serif;font-weight:600}
.railgrp{font-family:Archivo,system-ui,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px}
.rail .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.rail .cnt.crit{color:var(--crit);font-weight:600}
@media (max-width:880px){ .railgrp{display:none} }

.brcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.brcard{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:13px 15px;color:inherit;box-shadow:var(--shadow)}
.brcard:hover{border-color:var(--accent);border-left-color:var(--accent-ink);background:var(--surface-2)}
.brcard.is-crit{border-left-color:var(--crit)}
.brcard .v{font-family:Archivo,system-ui,sans-serif;font-size:26px;font-weight:600;line-height:1.05;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.brcard .foot{font-size:12px;color:var(--ink-3)}
.brcard .lbl{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.qbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.qtxt{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--accent-ink);
  font-family:Archivo,system-ui,sans-serif;flex-wrap:wrap}
.qprog{display:block;width:120px;height:5px;border-radius:3px;background:var(--surface);overflow:hidden}
.qprog span{display:block;height:100%;background:var(--accent)}
.qacts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
@media (max-width:620px){ .qacts{margin-left:0;width:100%} }

.chipx{border:0;background:none;padding:0 0 0 5px;color:inherit;cursor:pointer;font-size:13px;line-height:1}
.chipx:hover{opacity:.6}
tr.klick{cursor:pointer}
tr.klick:hover{background:var(--surface-2)}
.zuw{display:inline-flex;align-items:center;gap:6px}
.zuw select{width:auto;padding:3px 7px;font-size:12.5px;font-family:Archivo,system-ui,sans-serif;font-weight:600}

/* ---------- controls ---------- */
input,select,textarea,button{font-family:inherit;font-size:14px;color:inherit}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);
  padding:7px 9px;width:100%;
}
input:disabled{background:var(--sunken);color:var(--ink-3)}
textarea{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.55}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font-family:Archivo;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2);font-weight:500}
.btn.ghost:hover{background:var(--sunken)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:14px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-family:Archivo;font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.req{color:var(--crit);font-size:14px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.ihelp{
  border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0;
  width:15px;height:15px;border:1px solid currentColor;border-radius:50%;
  font:600 10px/13px Archivo,sans-serif;text-align:center;flex:none;
}
.ihelp:hover{color:var(--accent);background:var(--accent-soft)}
.helptext{
  font-size:12.5px;line-height:1.5;color:var(--ink-2);background:var(--accent-soft);
  border-left:2px solid var(--accent);padding:7px 10px;border-radius:0 var(--r) var(--r) 0;
}
.err{font-size:12.5px;color:var(--crit);font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.panel>header .lbl{margin-right:auto}
.panel .pad{padding:15px}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.kpi .v{font-family:Archivo;font-size:29px;font-weight:600;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--ink-3)}
.kpi.is-crit .v{color:var(--crit)}
.kpi.is-ok .v{color:var(--ok)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-family:Archivo;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.n{background:var(--sunken);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip .ic{font-size:10px}

/* ---------- task list ---------- */
.tasks{display:flex;flex-direction:column}
.task{
  display:grid;grid-template-columns:3px 1fr auto;gap:0 13px;align-items:center;
  border-top:1px solid var(--line);padding:0;
}
.tasks .task:first-child{border-top:0}
.task .stripe{align-self:stretch;background:var(--line-strong);border-radius:2px}
.task.crit .stripe{background:var(--crit)}
.task.warn .stripe{background:var(--warn)}
.task.acc .stripe{background:var(--accent)}
.task .body{padding:11px 0;min-width:0}
.task .t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.task .t1 b{font-family:Archivo;font-weight:600;font-size:13.5px}
.task .t2{font-size:13px;color:var(--ink-2);margin-top:2px}
.task .side{padding:11px 15px 11px 0;display:flex;align-items:center;gap:10px}
.task .due{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);line-height:1.35}
.task .due b{display:block;font-size:13px}
.task.crit .due b{color:var(--crit)}
.task .body{padding-left:0}
.tasks .task .body{padding-left:0}
.task>.stripe{margin:6px 0}

/* ---------- case rows ---------- */
.cases{display:flex;flex-direction:column}
.case{
  display:grid;grid-template-columns:118px minmax(0,1.5fr) minmax(0,1.2fr) 148px 92px;
  gap:14px;align-items:center;padding:11px 15px;border-top:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:inherit;
}
.cases .case:first-child{border-top:0}
.case:hover{background:var(--surface-2)}
.case .ln{font-family:Archivo;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .s2{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .rt{text-align:right}
@media (max-width:920px){
  .case{grid-template-columns:1fr auto;gap:6px 12px}
  .case .c-obj{grid-column:1/-1}
  .case .c-mieter,.case .c-phase{grid-column:1/-1}
}

/* ---------- phase bar ---------- */
.pbar{display:flex;gap:2px;align-items:center}
.pbar i{height:7px;flex:1;border-radius:2px;background:var(--sunken);display:block}
.pbar i.f1{background:var(--ph1)} .pbar i.f2{background:var(--ph2)} .pbar i.f3{background:var(--ph3)}
.pbar i.f4{background:var(--ph4)} .pbar i.f5{background:var(--ph5)}
.pbar i.cur{outline:1.5px solid var(--accent);outline-offset:1px}

/* ---------- phase sections ---------- */
.phase{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.phase+.phase{margin-top:10px}
.phase>summary{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;list-style:none;background:var(--surface-2)}
.phase>summary::-webkit-details-marker{display:none}
.phase>summary::after{content:"▾";margin-left:auto;color:var(--ink-3);font-size:12px;transition:transform .15s}
.phase[open]>summary::after{transform:rotate(180deg)}
.phase .pnum{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font:600 11px Archivo,sans-serif;flex:none}
.phase .pnum.p1{background:var(--ph1);color:var(--ph-ink-light)}
.phase .pnum.p2{background:var(--ph2);color:var(--ph-ink-light)}
.phase .pnum.p3{background:var(--ph3);color:var(--ph-ink-dark)}
.phase .pnum.p4{background:var(--ph4);color:var(--ph-ink-dark)}
.phase .pnum.p5{background:var(--ph5);color:var(--ph-ink-dark)}
.phase .ptitle{font-family:Archivo;font-weight:600;font-size:14px}
.phase .pbody{padding:13px 14px;border-top:1px solid var(--line)}

/* ---------- step ---------- */
.step{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px dashed var(--line)}
.step:first-child{border-top:0}
.step .mark{width:17px;height:17px;border-radius:4px;border:1.6px solid var(--line-strong);display:grid;place-items:center;font-size:10px;margin-top:1px;flex:none}
.step.done .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.step.na .mark{background:var(--sunken);border-color:var(--line-strong);color:var(--ink-3)}
.step.over .mark{border-color:var(--crit);color:var(--crit)}
.step .sl{font-size:14px;font-family:Archivo;font-weight:500}
.step.done .sl,.step.na .sl{color:var(--ink-2)}
.step .meta{font-size:12px;color:var(--ink-3);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step .acts{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.step .acts input[type=date]{width:auto;padding:3px 6px;font-size:12px}
.step .acts .btn.ghost{border-color:var(--line)}
@media (max-width:620px){ .step{grid-template-columns:18px 1fr} .step .acts{grid-column:2/-1;justify-content:flex-start;margin-top:5px} }

/* ---------- next-step callout ---------- */
.next{display:flex;gap:13px;align-items:flex-start;padding:14px 15px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.next.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.next .k{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
.next.done .k{color:var(--ok)}
.next h3{margin:3px 0 3px;font-size:16px}
.next p{margin:0;font-size:13.5px;color:var(--ink-2)}
.next .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:620px){ .next{flex-wrap:wrap} .next .acts{margin-left:0;width:100%} }

/* ---------- warnings ---------- */
.warn-list{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 15px;border-top:1px solid var(--line);font-size:13.5px}
.warn-list .wrow:first-child{border-top:0}
.wrow .ic{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font:600 11px Archivo;flex:none}
.wrow.crit .ic{background:var(--crit-soft);color:var(--crit)}
.wrow.warn .ic{background:var(--warn-soft);color:var(--warn)}
.wrow.info .ic{background:var(--accent-soft);color:var(--accent-ink)}
.wrow.ok .ic{background:var(--ok-soft);color:var(--ok)}
.wrow .w2{font-size:12.5px;color:var(--ink-2)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1.5px solid var(--line-strong);border-bottom:0}

/* ---------- charts ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:132px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar>span:first-child{line-height:1.25;min-width:0}
.bar .track{display:block;height:15px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0;min-width:2px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.bar.is-crit .fill{background:var(--crit)}
.meter{display:flex;gap:2px;height:26px;border-radius:3px;overflow:hidden}
.meter span{display:grid;place-items:center;font:600 11px Archivo;font-variant-numeric:tabular-nums}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--ink-2)}
.mlegend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

/* ---------- misc ---------- */
.hist{display:flex;flex-direction:column;gap:0;max-height:270px;overflow:auto}
.hitem{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:7px 0;border-top:1px dashed var(--line);font-size:12.5px}
.hist .hitem:first-child{border-top:0}
.hitem .ht{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.side{display:flex;flex-direction:column;gap:14px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}

.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;align-items:baseline}
.dl dt{color:var(--ink-3);font-size:12.5px}
.dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.dl .edit{border:0;background:none;padding:0 0 0 7px;color:var(--ink-3);font-family:Archivo;
  font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dl .edit:hover{color:var(--accent-ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.metric{background:var(--surface);padding:10px 13px}
.metric .v{font-family:Archivo;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.metric .v.crit{color:var(--crit)} .metric .v.ok{color:var(--ok)}
.empty{padding:30px 15px;text-align:center;color:var(--ink-3);font-size:13.5px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,18,24,.5);display:grid;place-items:start center;padding:24px 16px;overflow:auto}
.modal .box{background:var(--surface);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:620px;border:1px solid var(--line)}
.modal .box>header{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line)}
.modal .box>header h2{margin-right:auto}
.modal .box .pad{padding:17px}
.modal .box>footer{display:flex;gap:9px;justify-content:flex-end;padding:13px 17px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 8px 8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:var(--r);font-size:13px;line-height:1.45}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.info{background:var(--accent-soft);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:20px;font-family:Archivo;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .2s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}} }
.crumb{background:none;border:0;padding:0;color:var(--ink-2);font-family:Archivo;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.crumb:hover{color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-family:Archivo;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.excel{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);background:var(--sunken);padding:1px 5px;border-radius:3px;white-space:nowrap}
.sys{font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.02em;
  padding:1px 7px;border-radius:20px;white-space:nowrap;border:1px solid transparent;cursor:help}
.sys.s-grem{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

.sys.s-dokument{background:var(--sunken);color:var(--ink-2)}
.sys.s-vorort{background:var(--ok-soft);color:var(--ok)}
.sys.s-extern{background:var(--sunken);color:var(--ink-2)}
.gegen{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gegen>div{background:var(--surface);padding:13px 15px}

/* ============================================================
   2 · PROZESSMODELL  – 5 Phasen, 20 Schritte (Excel-Spalten L–AH)
   ============================================================ */
const PHASEN = [
  {nr:1, titel:"Erfassung",              excel:"A–K, N", zweck:"Objekt, Vormieter und die drei Schlüsseldaten festhalten."},
  {nr:2, titel:"Abnahme & Vermarktung",  excel:"L–V",    zweck:"Kündigung abwickeln, Wohnung ausschreiben, abnehmen und instand stellen."},

// Zwei Fristen mit unterschiedlichem Anker:
//  · Der Abnahmetermin muss vor der Wohnungsabgabe stehen – Anker ist das Haftungsdatum.
//  · Was die Handwerker machen müssen, weiss man erst nach der Abnahme – Anker ist der
//    Tag, an dem die Wohnungsabnahme tatsächlich durchgeführt wurde. Vorher entsteht
//    für diesen Schritt gar keine Frist.
const VORLAUF_ABNAHME   = 30;   // Tage vor der Wohnungsabgabe
const FRIST_HANDWERKER  = 3;    // Tage nach der durchgeführten Wohnungsabnahme
const SOLL_ABNAHME    = {anker:"haftungsdatum", offset:-VORLAUF_ABNAHME,
                         txt:VORLAUF_ABNAHME+" Tage vor Wohnungsabgabe"};
const SOLL_HANDWERKER = {anker:"schritt:wa", offset:FRIST_HANDWERKER,
                         txt:FRIST_HANDWERKER+" Tage nach der Wohnungsabnahme"};

const BEREICHE = [
  {k:"abnahme",    titel:"Kündigung & Abnahme", phasen:[1,2], excel:"A–V",
   zweck:"Kündigung abwickeln, Objekt vermarkten, abnehmen und instand stellen."},
  {k:"vermietung", titel:"Wiedervermietung",    phasen:[3,4], excel:"W–AE",

];
const BEREICH_VON_PHASE = {};
BEREICHE.forEach(b=>b.phasen.forEach(n=>BEREICH_VON_PHASE[n]=b.k));
const BEREICH = k => BEREICHE.find(b=>b.k===k);
function bereichVonFall(f){ return BEREICH_VON_PHASE[aktuellePhase(f)]; }

// die Daten selbst liegen im jeweiligen System. Die Zuordnung ist eine Annahme
// aus den Excel-Spaltentexten und gehört später in die Stammdaten.

  grem:     {t:"Garaio REM", h:"Wird in Garaio REM ausgeführt. Hier wird nur festgehalten, dass es erledigt ist."},
  vmz:      {t:"VMZ",        h:"Wird in der Vermietungszentrale bzw. auf den Portalen ausgeführt."},
  dokument: {t:"Dossier",    h:"Dokument im Objektdossier auf SharePoint."},
  vorort:   {t:"vor Ort",    h:"Termin am Objekt, mit Mieter oder Nachmieter."},

const SCHRITT_SYSTEM = {

  vertrag_vers:"grem", vertrag_ret:"dokument", info_werke:"extern", schluessel:"vorort",

/* ============================================================
   3 · HILFSFUNKTIONEN
   ============================================================ */
// Alle Daten werden als UTC-Mitternacht geführt. Würde lokale Mitternacht mit
// toISOString() kombiniert, ergäbe das in MEZ/MESZ durchgehend den Vortag.
const HEUTE = (()=>{ const n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); })();
const TAG = 86400000;
function iso(d){ return d.toISOString().slice(0,10); }
function tage(n){ return iso(new Date(HEUTE.getTime()+n*TAG)); }
function parse(s){ if(!s) return null; const d=new Date(s+"T00:00:00Z"); return isNaN(d)?null:d; }
function plus(s,n){ const d=parse(s); return d?iso(new Date(d.getTime()+n*TAG)):null; }
function diffT(a,b){ const x=parse(a), y=parse(b); if(!x||!y) return null; return Math.round((y-x)/TAG); }
function seitHeute(s){ const d=parse(s); if(!d) return null; return Math.round((HEUTE-d)/TAG); }
const MONATE=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function fmt(s){ const d=parse(s); if(!d) return "–"; return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."+d.getUTCFullYear(); }
function fmtKurz(s){ const d=parse(s); if(!d) return "–"; return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."; }
// Berichtsmonat richtet sich nach dem Leerstandsbeginn, nicht nach dem Haftungsdatum:
// endet die Haftung am 31.08., ist der Leerstand ein September-Fall.
function berichtsmonat(haft){ const b=plus(haft,1); const d=parse(b); if(!d) return "–"; return MONATE[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function tg(n){ return n===1 ? "1 Tag" : n+" Tage"; }    // Nominativ: «5 Tage Leerstand»
function tgD(n){ return n===1 ? "1 Tag" : n+" Tagen"; }  // Dativ: «in 5 Tagen», «seit 5 Tagen»
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function objekt(id){ return OBJEKTE.find(o=>o.id===id); }
function lig(id){ return LIEGENSCHAFTEN.find(l=>l.id===id); }
function objLabel(id){ const o=objekt(id); if(!o) return "–"; const l=lig(o.lig); return l.name+", "+o.stock; }
function objVoll(id){ const o=objekt(id); if(!o) return "–"; const l=lig(o.lig); return l.name+", "+l.ort+" · "+o.stock+" · "+o.zi.toFixed(1).replace(".",",")+" Zi."; }

/* ============================================================
   4 · DEMODATEN  – alle Termine relativ zu heute, damit der
   Prototyp jeden Tag realistisch bleibt
   ============================================================ */
function neuerFallObj(o){
  const schritte={};
  SCHRITTE.forEach(s=>{ schritte[s.k]={status:"offen",datum:null,von:null,grund:null,termin:null}; });
  const hist=[];
  const angelegt = o.angelegt!=null ? o.angelegt : -30;
  hist.push({d:tage(angelegt), von:o.bew, txt:"Fall angelegt"});
  const dn = o.done==="alle" ? Object.fromEntries(SCHRITTE.map((s,i)=>[s.k, angelegt+3+i*2])) : (o.done||{});
  Object.entries(dn).forEach(([k,off])=>{
    if(!schritte[k]) return;
    schritte[k]={status:"erledigt",datum:tage(off),von:o.bew,grund:null,termin:null};
    hist.push({d:tage(off), von:o.bew, txt:"Schritt erledigt: "+SCHRITT[k].t});
  });
  (o.na||[]).forEach(k=>{
    schritte[k]={status:"na",datum:tage(angelegt+4),von:o.bew,grund:(o.naGrund&&o.naGrund[k])||"Objekt ist dem Team bekannt",termin:null};
    hist.push({d:tage(angelegt+4), von:o.bew, txt:"Als nicht erforderlich markiert: "+SCHRITT[k].t});
  });
  Object.entries(o.termine||{}).forEach(([k,off])=>{ if(schritte[k]) schritte[k].termin=tage(off); });
  const f={
    id:o.id, objektId:o.obj, bewirtschafter:o.bew,
    exMieter:o.ex||"", gekuendigtPer:o.kue!=null?tage(o.kue):"", haftungsdatum:o.haft!=null?tage(o.haft):"",
    mieterSeit:o.seit||"", neuerMieter:o.neu||"", vermietetPer:o.verm!=null?tage(o.verm):"",
    notiz:o.notiz||"", schritte, historie:hist,
    abgeschlossen:o.zu!=null?{am:tage(o.zu),von:o.bew}:null,
    angelegtAm:tage(angelegt)
  };
  if(f.abgeschlossen) hist.push({d:f.abgeschlossen.am, von:o.bew, txt:"Fall abgeschlossen"});
  hist.sort((a,b)=> a.d<b.d?1:-1);
  return f;
}

/* ============================================================
   5 · ABGELEITETE LOGIK  – im Excel manuell bzw. gar nicht vorhanden
   ============================================================ */
const FELDNAME = {objektId:"Objekt", bewirtschafter:"Bewirtschafter", exMieter:"ex-Mieter",
  gekuendigtPer:"gekündigt per", haftungsdatum:"Haftungsdatum", mieterSeit:"Mieter seit",
  neuerMieter:"neuer Mieter", vermietetPer:"Vermietet per"};
const PFLICHT_P1 = [
  {f:"objektId",      t:"Objekt"},
  {f:"exMieter",      t:"ex-Mieter"},
  {f:"gekuendigtPer", t:"gekündigt per"},
  {f:"haftungsdatum", t:"Haftungsdatum"}
];
const PFLICHT_P3 = [
  {f:"neuerMieter",  t:"neuer Mieter"},
  {f:"vermietetPer", t:"Vermietet per"}
];
function fehlendeFelder(f,phase){
  const l = phase===1 ? PFLICHT_P1 : phase===3 ? PFLICHT_P3 : [];
  return l.filter(x=>!f[x.f]);
}
function phaseKomplett(f,n){
  if(n===1) return fehlendeFelder(f,1).length===0;
  const alle = SCHRITTE_P(n).every(s=>f.schritte[s.k].status!=="offen");
  if(n===3) return alle && fehlendeFelder(f,3).length===0;
  return alle;
}
function aktuellePhase(f){ for(let n=1;n<=5;n++) if(!phaseKomplett(f,n)) return n; return 5; }
function abschliessbar(f){ return !f.abgeschlossen && [1,2,3,4,5].every(n=>phaseKomplett(f,n)); }
function fortschritt(f){ return [1,2,3,4,5].filter(n=>phaseKomplett(f,n)).length; }

function naechsterSchritt(f){
  if(f.abgeschlossen) return null;
  const p = aktuellePhase(f);
  const fehltP1 = fehlendeFelder(f,1);
  if(fehltP1.length) return {art:"feld", phase:1, felder:fehltP1,
    titel:"Pflichtangabe fehlt: "+fehltP1.map(x=>x.t).join(", "),
    text:"Ohne diese Angaben lassen sich weder Leerstandstage noch Fristen berechnen."};
  if(p===3 && !f.neuerMieter) return {art:"feld", phase:3, felder:[{f:"neuerMieter",t:"neuer Mieter"}],
    titel:"Pflichtangabe fehlt: neuer Mieter",
    text:"Solange kein Nachmieter zugesagt hat, lässt sich kein Vertrag versenden. Die Vermarktung läuft – hier wird der Name erfasst, sobald die Zusage vorliegt."};
  const offen = SCHRITTE_P(p).filter(s=>f.schritte[s.k].status==="offen");
  if(offen.length){
    // Ein verstrichener oder heute fälliger Termin geht der Reihenfolge vor
    const datiert = offen.filter(s=>terminVon(f,s))
      .sort((a,b)=> terminVon(f,a) < terminVon(f,b) ? -1 : 1);
    const dringend = datiert.find(s=>seitHeute(terminVon(f,s))>=0);
    const s=dringend||offen[0];
    const tv=terminVon(f,s), soll=istSoll(f,s);
    let text = s.h;
    if(tv){
      const d=seitHeute(tv);
      const bezug = soll && s.soll.anker==="haftungsdatum"
        ? ", Wohnungsabgabe am "+fmt(f.haftungsdatum) : "";
      const frist = soll ? "Sollfrist "+fmt(tv)+" ("+s.soll.txt+bezug+")" : "Termin "+fmt(tv);
      text = d>0 ? frist+" – seit "+tgD(d)+" überschritten."
           : d===0 ? frist+" – heute fällig."
           : frist+" – in "+tgD(-d)+".";
    }
    return {art:"schritt", phase:p, schritt:s, titel:schrittTitel(f,s), text,
            soll, terminSetzen: !!(soll && s.terminIstAufgabe)};
  }
  const fehltP3 = fehlendeFelder(f,3);
  if(p===3 && fehltP3.length) return {art:"feld", phase:3, felder:fehltP3,
    titel:"Pflichtangabe fehlt: "+fehltP3.map(x=>x.t).join(", "),
    text:"Die Neuvermietung gilt erst mit Nachmieter und Vermietungsdatum als abgeschlossen."};
  if(abschliessbar(f)) return {art:"abschluss", phase:5, titel:"Fall kann abgeschlossen werden",
    text:"Alle fünf Phasen sind vollständig – inklusive Schlussabrechnung und Zahlungseingang."};
  return null;
}

// Das Haftungsdatum ist der letzte Tag der Mieterhaftung – der Leerstand beginnt
// am Folgetag. Gezählt werden die leeren Kalendertage einschliesslich des ersten
// und des letzten: bei Haftung bis 31.08. und Vermietung ab 01.09. sind das 0 Tage.
function leerstand(f){
  const start = ST.basis==="haftung" ? f.haftungsdatum : f.gekuendigtPer;
  if(!start) return null;
  const beginn = plus(start,1);
  if(f.vermietetPer){
    const t = diffT(start, f.vermietetPer) - 1;   // letzter leerer Tag = Vermietet per minus 1
    return {tage:Math.max(0,t), roh:t, laufend:false, kuenftig:false, bisBeginn:0,
            start, beginn, ende:plus(f.vermietetPer,-1)};
  }
  const t = diffT(start, iso(HEUTE));             // heute wird mitgezählt
  return {tage:Math.max(0,t), roh:t, laufend:true, kuenftig:t<=0, bisBeginn:1-t,
          start, beginn, ende:iso(HEUTE)};
}
function vorlauftage(f){
  if(!f.gekuendigtPer || !f.haftungsdatum) return null;
  return diffT(f.gekuendigtPer, f.haftungsdatum);
}
function tageInPhase(f){
  const p = aktuellePhase(f);
  const daten = SCHRITTE_P(p).map(s=>f.schritte[s.k].datum).filter(Boolean).sort();
  const start = daten.length ? daten[daten.length-1] : f.angelegtAm;
  return seitHeute(start);
}
// Sollfrist: erst vorhanden, wenn ihr Ankerdatum feststeht.
function sollTermin(f,s){
  if(!s.soll) return null;
  const a=s.soll.anker;
  let basis=null;
  if(a==="haftungsdatum") basis=f.haftungsdatum;
  else if(a.indexOf("schritt:")===0){
    const st=f.schritte[a.slice(8)];
    basis = (st && st.status==="erledigt") ? st.datum : null;   // sonst: noch keine Frist
  }
  return basis ? plus(basis, s.soll.offset) : null;
}
// Ein von Hand gesetzter Termin geht der Sollfrist vor.
function terminVon(f,s){ return f.schritte[s.k].termin || sollTermin(f,s); }
function istSoll(f,s){ return !f.schritte[s.k].termin && !!sollTermin(f,s); }
// Solange kein Termin steht, heisst der Schritt nach der Handlung, die jetzt ansteht.
function schrittTitel(f,s){
  return (s.tOffen && f.schritte[s.k].status==="offen" && !f.schritte[s.k].termin) ? s.tOffen : s.t;
}
function offeneTermine(f){
  if(f.abgeschlossen) return [];
  return SCHRITTE.filter(s=>f.schritte[s.k].status==="offen" && terminVon(f,s))
    .map(s=>({schritt:s, termin:terminVon(f,s), soll:istSoll(f,s), ueber:seitHeute(terminVon(f,s))}));
}
function istUeberfaellig(f){ return offeneTermine(f).some(t=>t.ueber>0); }

function warnungen(f){
  const w=[];
  if(f.abgeschlossen) return w;
  offeneTermine(f).forEach(t=>{
    const titel=schrittTitel(f,t.schritt);
    const bezug = t.soll
      ? "Sollfrist "+fmt(t.termin)+" · "+t.schritt.soll.txt
        + (t.schritt.soll.anker==="haftungsdatum" ? " (Wohnungsabgabe am "+fmt(f.haftungsdatum)+")" : "")+"."
      : "Termin am "+fmt(t.termin)+".";
    if(t.ueber>0) w.push({stufe:"crit", titel:titel+(t.soll?" – Sollfrist überschritten":" überfällig"),
      text:bezug+" Seit "+tgD(t.ueber)+" offen."});
    else if(t.ueber>=-7) w.push({stufe:"warn",
      titel:titel+(t.ueber===0?" heute fällig":" fällig in "+tgD(-t.ueber)), text:bezug});
  });
  const dop = FAELLE.filter(x=>x.id!==f.id && x.objektId===f.objektId && !x.abgeschlossen);
  dop.forEach(x=>w.push({stufe:"crit", titel:"Zweiter offener Fall zum selben Objekt",
    text:"Fall "+x.id+" ("+x.bewirtschafter+") ist zum selben Objekt ebenfalls offen. Einer der beiden dürfte doppelt erfasst sein.", fall:x.id}));
  if(f.gekuendigtPer && f.haftungsdatum && diffT(f.gekuendigtPer,f.haftungsdatum)<0)
    w.push({stufe:"crit", titel:"Haftungsdatum liegt vor dem Kündigungsdatum",
      text:"Haftungsdatum "+fmt(f.haftungsdatum)+" ist früher als «gekündigt per» "+fmt(f.gekuendigtPer)+". Eines der beiden Daten ist falsch erfasst.", feld:"haftungsdatum"});
  if(f.vermietetPer && f.haftungsdatum && diffT(f.haftungsdatum,f.vermietetPer)<0)
    w.push({stufe:"warn", titel:"«Vermietet per» liegt vor dem Haftungsdatum",
      text:"Das Objekt wäre vermietet, bevor es leer steht – bitte prüfen.", feld:"vermietetPer"});
  const wt=f.schritte.wa.termin;
  if(wt && f.gekuendigtPer && diffT(f.gekuendigtPer,wt)<0)
    w.push({stufe:"warn", titel:"WA-Termin liegt vor dem Kündigungsdatum", text:"Bitte den WA-Termin prüfen."});
  const p = aktuellePhase(f), fehlt = fehlendeFelder(f,p);
  if(fehlt.length) w.push({stufe:"warn", titel:"Pflichtangaben fehlen",
    text:"In Phase "+p+" fehlt: "+fehlt.map(x=>x.t).join(", ")+"."});
  const ls = leerstand(f);
  if(ls && ls.laufend && !ls.kuenftig && ls.tage>60)
    w.push({stufe:"warn", titel:"Langläufer – "+tg(ls.tage)+" Leerstand",
      text:"Das Objekt steht seit über 60 Tagen leer und ist noch nicht vermietet."});
  if(abschliessbar(f)) w.push({stufe:"info", titel:"Fall kann abgeschlossen werden",
    text:"Alle Phasen sind vollständig."});
  return w;
}

/* ============================================================
   6 · ZUSTAND & SPEICHERUNG
   ============================================================ */
const KEY="leerstandsmanager.demo.v1";
let FAELLE = [];
let ST = {basis:"haftung", sicht:"meine", nav:"dashboard", fallId:null,
          ich:"Moren", rolle:"bewirtschafter",
          bereich:null, mitarbeiter:null,
          queue:null, qIdx:0, qHerkunft:null,
          q:"", fBew:"", fPhase:"", fStatus:"offen", fUeber:false};

/* ---------- Rechte ---------- */
function darfBearbeiten(f){
  if(ST.rolle==="lesend") return false;
  if(ST.rolle==="leitung") return true;
  return f.bewirtschafter===ST.ich;
}
function darfAnlegen(){ return ST.rolle!=="lesend"; }
function darfZuweisen(){ return ST.rolle==="leitung"; }
function istLeitung(){ return ST.rolle==="leitung"; }
function anmelden(name){
  const b=benutzer(name); if(!b) return;
  ST.ich=b.name; ST.rolle=b.rolle;
  ST.queue=null; ST.qIdx=0; ST.mitarbeiter=null; ST.bereich=null;
  ST.nav="dashboard"; ST.sicht = b.rolle==="bewirtschafter" ? "meine" : "team";
  speichern(); render();
  toast("Angemeldet als "+b.name+" · "+ROLLEN[b.rolle].t);
}

function speichern(){
  try{ localStorage.setItem(KEY, JSON.stringify({faelle:FAELLE, basis:ST.basis, sicht:ST.sicht,
        ich:ST.ich, rolle:ST.rolle})); }
  catch(e){ /* privates Fenster o. Ä. – der Prototyp läuft auch ohne Speicherung */ }
}
function laden(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw);
      if(d && Array.isArray(d.faelle) && d.faelle.length){
        FAELLE=d.faelle; if(d.basis) ST.basis=d.basis; if(d.sicht) ST.sicht=d.sicht;
        if(d.ich) ST.ich=d.ich; if(d.rolle) ST.rolle=d.rolle; return; }
    }
  }catch(e){}
  FAELLE = demodaten();
}
function fall(id){ return FAELLE.find(f=>f.id===id); }
// Jede ändernde Aktion prüft selbst – eine ausgeblendete Schaltfläche ist keine Berechtigung.
function gesperrt(id){
  const f=fall(id);
  if(f && darfBearbeiten(f)) return false;
  toast("Keine Berechtigung, diesen Fall zu ändern.");
  return true;
}
function protokoll(f,txt){ f.historie.unshift({d:iso(HEUTE), von:ST.ich, txt}); }

/* ---------- Aktionen ---------- */
function erledigen(id,k){
  if(gesperrt(id)) return;
  const f=fall(id), s=f.schritte[k];
  s.status="erledigt"; s.datum=iso(HEUTE); s.von=ST.ich; s.grund=null;
  protokoll(f,"Schritt erledigt: "+SCHRITT[k].t);
  // Schritte, deren Frist an genau diesem Schritt hängt, bekommen jetzt eine.
  const folge = SCHRITTE.filter(x=>x.soll && x.soll.anker==="schritt:"+k
                                 && f.schritte[x.k].status==="offen" && !f.schritte[x.k].termin);
  let msg = "«"+SCHRITT[k].t+"» erledigt";
  folge.forEach(x=>{
    const frist=sollTermin(f,x);
    protokoll(f,"Frist gesetzt: "+(x.tOffen||x.t)+" bis "+fmt(frist)+" ("+x.soll.txt+")");
    msg += " · "+(x.tOffen||x.t)+" bis "+fmt(frist);
  });
  nach(f,msg);
}
function nichtErforderlich(id,k,grund){
  if(gesperrt(id)) return;
  const f=fall(id), s=f.schritte[k];
  s.status="na"; s.datum=iso(HEUTE); s.von=ST.ich; s.grund=grund||"nicht erforderlich";
  protokoll(f,"Als nicht erforderlich markiert: "+SCHRITT[k].t+(grund?" ("+grund+")":""));
  nach(f,"«"+SCHRITT[k].t+"» als nicht erforderlich markiert");
}
function zuruecksetzen(id,k){
  if(gesperrt(id)) return;
  const f=fall(id), s=f.schritte[k];
  s.status="offen"; s.datum=null; s.von=null; s.grund=null;
  protokoll(f,"Schritt wieder geöffnet: "+SCHRITT[k].t);
  nach(f,"«"+SCHRITT[k].t+"» wieder offen");
}
function setTermin(id,k,d){
  if(gesperrt(id)) return;
  const f=fall(id), s=f.schritte[k], alt=s.termin;
  s.termin = d||null;
  protokoll(f,"Termin "+SCHRITT[k].t+": "+(alt?fmt(alt)+" → ":"")+(d?fmt(d):"entfernt"));
  nach(f, d ? (SCHRITT[k].tl||"Termin")+" auf "+fmt(d)+" gesetzt" : "Termin entfernt");
}
function setFeld(id,feld,wert){
  if(gesperrt(id)) return;
  const f=fall(id); if(f[feld]===wert) return;
  const alt=f[feld];
  f[feld]=wert;
  const lab = FELDNAME[feld] || feld;
  const zeig = v => v ? (/\d{4}-\d{2}-\d{2}/.test(v)?fmt(v):v) : "leer";
  protokoll(f, lab+": "+zeig(alt)+" → "+zeig(wert));
  const wirkung = feld==="haftungsdatum" ? haftungsdatumVerschoben(f,alt,wert) : null;
  if(wirkung) protokoll(f, wirkung.protokoll);
  nach(f, wirkung ? wirkung.meldung : lab+" auf "+zeig(wert)+" gesetzt");
}

// Ein nachträglich verschobenes Haftungsdatum – etwa bei ausserordentlicher Kündigung
// mit Nachmieterstellung – verschiebt Leerstandsbeginn und alle Sollfristen mit.
// Das soll im selben Moment sichtbar sein, nicht erst als rote Zeile am nächsten Tag.
function haftungsdatumVerschoben(f,alt,neu){
  if(!alt || !neu) return null;
  const d = diffT(alt,neu);
  if(d===0) return null;
  const richtung = d<0 ? Math.abs(d)+" "+(Math.abs(d)===1?"Tag":"Tage")+" vorverlegt"
                       : d+" "+(d===1?"Tag":"Tage")+" nach hinten verschoben";
  const offen = SCHRITTE.filter(x=>x.soll && x.soll.anker==="haftungsdatum"
                                && f.schritte[x.k].status==="offen");
  let zusatz="", proto="Leerstandsbeginn neu "+fmt(plus(neu,1))+".";
  if(offen.length){
    const soll = plus(neu,-VORLAUF_ABNAHME), ueber = seitHeute(soll);
    const namen = offen.map(x=>x.tOffen||x.t).join(" und ");
    zusatz = " Sollfrist für "+namen+" jetzt "+fmt(soll)
           + (ueber>0 ? " – bereits überschritten." : ueber===0 ? " – heute fällig." : ".");
    proto += " Sollfrist "+namen+": "+fmt(soll)+".";
  }
  return {meldung:"Haftungsdatum "+richtung+"."+zusatz, protokoll:proto};
}
function abschliessen(id){
  if(gesperrt(id)) return;
  const f=fall(id);
  if(!abschliessbar(f)){ toast("Abschluss nicht möglich – es sind noch Schritte offen."); return; }
  f.abgeschlossen={am:iso(HEUTE), von:ST.ich};
  protokoll(f,"Fall abgeschlossen");
  nach(f,"Fall "+f.id+" abgeschlossen");
}
function wiederOeffnen(id){
  if(gesperrt(id)) return;
  const f=fall(id); f.abgeschlossen=null;
  protokoll(f,"Fall wieder geöffnet");
  nach(f,"Fall "+f.id+" wieder geöffnet");
}
function zurueckstellen(id,n){
  if(gesperrt(id)) return;
  const f=fall(id);
  f.wiedervorlage={datum:tage(n), von:ST.ich};
  protokoll(f,"Zurückgestellt bis "+fmt(f.wiedervorlage.datum));
  speichern();
  toast("Zurückgestellt bis "+fmt(f.wiedervorlage.datum));
  if(ST.queue && ST.queue[ST.qIdx]===id) queueSpringe(1); else render();
}
function zuweisen(id,name){
  if(!darfZuweisen()){ toast("Zuständigkeiten ändert die Teamleitung."); return; }
  const f=fall(id), alt=f.bewirtschafter;
  if(alt===name) return;
  f.bewirtschafter=name;
  protokoll(f,"Zuständigkeit: "+alt+" → "+name);
  speichern(); render(); toast("Zuständigkeit an "+name+" übergeben");
}
function wiedervorlageAufheben(id){
  if(gesperrt(id)) return;
  const f=fall(id); if(!f.wiedervorlage) return;
  f.wiedervorlage=null; protokoll(f,"Zurückstellung aufgehoben");
  speichern(); render(); toast("Zurückstellung aufgehoben");
}

/* ---------- Durcharbeiten: Aufgaben der Reihe nach abarbeiten ---------- */
function starteQueue(liste, herkunft){
  const a=liste.filter(x=>!x.zurueck);
  if(!a.length){ toast("Keine offenen Aufgaben."); return; }
  ST.queue=a.map(x=>x.f.id); ST.qIdx=0; ST.qHerkunft=herkunft;
  geheZu("fall", ST.queue[0]);
}
function queueBeenden(msg){
  const h=ST.qHerkunft||{nav:"dashboard"};
  ST.queue=null; ST.qIdx=0; ST.qHerkunft=null; ST.fallId=null;
  ST.nav=h.nav; ST.bereich=h.bereich||null; ST.mitarbeiter=h.mitarbeiter||null;
  render(); if(msg) toast(msg);
}
function queueSpringe(d){
  if(!ST.queue) return;
  const i=ST.qIdx+d;
  if(i<0) return;
  if(i>=ST.queue.length){ queueBeenden("Alle Aufgaben durchgearbeitet."); return; }
  ST.qIdx=i; geheZu("fall", ST.queue[i]);
}
// Weiterspringen, sobald an diesem Fall nichts Dringendes mehr offen ist.
function nochDringend(f){
  const n=naechsterSchritt(f);
  if(!n) return false;
  if(n.art!=="schritt") return true;               // fehlende Angabe oder Abschluss: dranbleiben
  const t=terminVon(f,n.schritt);
  return t ? seitHeute(t)>=0 : false;              // überfällig oder heute fällig
}
function nach(f,msg){
  speichern();
  if(ST.queue && ST.nav==="fall" && ST.queue[ST.qIdx]===f.id && !nochDringend(f)){
    toast(msg); queueSpringe(1); return;
  }
  render(); toast(msg);
}

let toastT=null;
function toast(msg){
  const alt=document.getElementById("toast"); if(alt) alt.remove();
  const el=document.createElement("div"); el.className="toast"; el.id="toast"; el.setAttribute("role","status");
  el.textContent=msg; document.body.appendChild(el);
  clearTimeout(toastT); toastT=setTimeout(()=>el.remove(), 2600);
}

/* ============================================================
   7 · DARSTELLUNGS-BAUSTEINE
   ============================================================ */
function phaseBar(f){
  const done=[1,2,3,4,5].map(n=>phaseKomplett(f,n));
  const cur=aktuellePhase(f), zu=!!f.abgeschlossen;
  return '<span class="pbar" role="img" aria-label="Phase '+(zu?5:cur)+' von 5">'+
    [1,2,3,4,5].map(n=>'<i class="'+(done[n-1]?"f"+n:"")+(!zu&&n===cur?" cur":"")+'"></i>').join("")+'</span>';
}
function statusChip(f){
  if(f.abgeschlossen) return '<span class="chip ok"><span class="ic">✓</span>abgeschlossen</span>';
  if(f.wiedervorlage && seitHeute(f.wiedervorlage.datum)<0)
    return '<span class="chip n">zurückgestellt bis '+fmtKurz(f.wiedervorlage.datum)+'</span>';
  if(istUeberfaellig(f)) return '<span class="chip crit"><span class="ic">!</span>überfällig</span>';
  const ls=leerstand(f);
  if(ls && ls.laufend && !ls.kuenftig && ls.tage>60) return '<span class="chip warn"><span class="ic">▲</span>Langläufer</span>';
  if(ls && ls.kuenftig) return '<span class="chip n">Vorlauf</span>';
  return '<span class="chip acc">Phase '+aktuellePhase(f)+'</span>';
}
function leerstandText(f){
  const ls=leerstand(f);
  if(!ls) return "–";
  if(ls.kuenftig) return "in "+ls.bisBeginn+" T.";
  return ls.tage+" T."+(ls.laufend?"":"");
}
function aendern(f,feld){
  if(!darfBearbeiten(f)) return "";
  return '<button class="edit" data-feld-edit="'+feld+'" type="button">ändern</button>';
}
function hilfeBtn(key){ return '<button class="ihelp" data-hilfe="'+key+'" aria-label="Erklärung anzeigen" type="button">i</button>'; }

function sichtFaelle(){
  if(ST.rolle!=="bewirtschafter") return FAELLE;
  return ST.sicht==="meine" ? FAELLE.filter(f=>f.bewirtschafter===ST.ich) : FAELLE;
}
function faelleVon(name){ return FAELLE.filter(f=>f.bewirtschafter===name); }

/* Aufgabenliste: was der Benutzer als Nächstes tun muss, nach Dringlichkeit */
function aufgaben(basis, opt){
  opt=opt||{};
  const out=[];
  basis.filter(f=>!f.abgeschlossen).forEach(f=>{
    const n=naechsterSchritt(f); if(!n) return;
    const br=bereichVonFall(f);
    if(opt.bereich && br!==opt.bereich) return;
    const zurueck = !!(f.wiedervorlage && seitHeute(f.wiedervorlage.datum)<0);
    if(zurueck && opt.ohneZurueckgestellt) return;
    let stufe="acc", frist=null, sort=3, fristTxt="";
    if(n.art==="schritt"){
      const t=terminVon(f,n.schritt);
      if(t){ const d=seitHeute(t); frist=t;
        if(d>0){ stufe="crit"; sort=0; fristTxt=d+" T. überfällig"; }
        else if(d<=7){ stufe="warn"; sort=1; fristTxt=d===0?"heute":"in "+(-d)+" T."; }
        else { fristTxt="in "+(-d)+" T."; sort=2; }
      } else fristTxt="Phase "+n.phase;
    } else if(n.art==="feld"){ stufe="warn"; sort=1; fristTxt="unvollständig"; }
    else if(n.art==="abschluss"){ stufe="acc"; sort=2; fristTxt="bereit"; }
    if(zurueck){ stufe="n"; sort=4; frist=null;
      fristTxt="zurückgestellt bis "+fmtKurz(f.wiedervorlage.datum); }
    const ls=leerstand(f);
    out.push({f, n, stufe, frist, fristTxt, sort, ls, bereich:br, zurueck});
  });
  out.sort((a,b)=> a.sort-b.sort ||
    (a.frist&&b.frist ? (a.frist<b.frist?-1:1) : 0) ||
    ((b.ls?b.ls.tage:0)-(a.ls?a.ls.tage:0)));
  return out;
}

function aufgabenZeilen(liste, zeigeName){
  if(!liste.length) return '<div class="empty">Keine offenen Aufgaben.</div>';
  return liste.map(a=>`
    <div class="task ${a.stufe}">
      <span class="stripe"></span>
      <div class="body">
        <div class="t1">
          <b>${esc(a.n.titel)}</b>
          ${a.n.art==="abschluss"?'<span class="chip ok">bereit</span>':''}
          <span class="chip n">${esc(BEREICH(a.bereich).titel)}</span>
        </div>
        <div class="t2">
          <span class="nr">${esc(objekt(a.f.objektId).nr)}</span> ·
          ${esc(objLabel(a.f.objektId))} · ex ${esc(a.f.exMieter||"—")}
          ${zeigeName?" · <b>"+esc(a.f.bewirtschafter)+"</b>":""}
        </div>
      </div>
      <div class="side">
        <span class="due"><b>${esc(a.fristTxt||"—")}</b>${a.frist?fmtKurz(a.frist):""}</span>
        <button class="btn sm" data-open="${a.f.id}">Öffnen</button>
      </div>
    </div>`).join("");
}
function bereichZahlen(basis,k){
  const a=aufgaben(basis,{bereich:k});
  return {faelle: basis.filter(f=>!f.abgeschlossen && bereichVonFall(f)===k).length,
          aufgaben:a.length,
          dringend:a.filter(x=>x.stufe==="crit").length,
          bald:a.filter(x=>x.stufe==="warn").length};
}
function bereichKacheln(basis,herkunft){
  return `<div class="brcards">${BEREICHE.map(b=>{
    const z=bereichZahlen(basis,b.k);
    return `<button class="brcard ${z.dringend?"is-crit":""}" data-bereich="${b.k}">
      <span class="lbl">${esc(b.titel)} <span class="excel">${esc(b.excel)}</span></span>
      <span class="v">${z.faelle}</span>
      <span class="foot">${z.faelle===1?"offener Fall":"offene Fälle"}${z.dringend?" · <b style=\"color:var(--crit)\">"+z.dringend+" dringend</b>":z.bald?" · "+z.bald+" bald fällig":""}</span>
    </button>`;}).join("")}</div>`;
}
function kpiBlock(basis){
  const offen=basis.filter(f=>!f.abgeschlossen);
  const ueber=offen.filter(istUeberfaellig);
  const laufend=offen.map(leerstand).filter(l=>l&&l.laufend&&!l.kuenftig);
  const avg=laufend.length? Math.round(laufend.reduce((s,l)=>s+l.tage,0)/laufend.length) : null;
  const mon=basis.filter(f=>f.abgeschlossen && parse(f.abgeschlossen.am).getUTCMonth()===HEUTE.getUTCMonth()
                            && parse(f.abgeschlossen.am).getUTCFullYear()===HEUTE.getUTCFullYear());
  return `<div class="kpis">
    <div class="kpi"><span class="lbl">Offene Fälle</span><span class="v">${offen.length}</span>
      <span class="foot">von ${basis.length} insgesamt</span></div>
    <div class="kpi ${ueber.length?"is-crit":""}"><span class="lbl">Überfällig</span><span class="v">${ueber.length}</span>
      <span class="foot">${ueber.length?"Frist verstrichen, Schritt offen":"keine verstrichenen Fristen"}</span></div>
    <div class="kpi"><span class="lbl">Ø Leerstandstage</span><span class="v">${avg==null?"–":avg}</span>
      <span class="foot">laufende Leerstände</span></div>
    <div class="kpi is-ok"><span class="lbl">Abgeschlossen</span><span class="v">${mon.length}</span>
      <span class="foot">im ${MONATE[HEUTE.getUTCMonth()]} ${HEUTE.getUTCFullYear()}</span></div>
  </div>`;
}
function durcharbeitenBtn(anz,label){
  return `<button class="btn pri" id="btnQueue" ${anz?"":"disabled"}>▸ ${esc(label||"Aufgaben durcharbeiten")}${anz?" ("+anz+")":""}</button>`;
}

/* ============================================================
   7c · ANSICHT: TEAMÜBERSICHT (Teamleitung)
   ============================================================ */
function teamZeile(name){
  const f=faelleVon(name), offen=f.filter(x=>!x.abgeschlossen);
  const a=aufgaben(f);
  const crit=a.filter(x=>x.stufe==="crit");
  const aeltest=crit.reduce((m,x)=>{ const d=x.frist?seitHeute(x.frist):0; return d>m?d:m; },0);
  const zu=f.filter(x=>x.abgeschlossen && x.vermietetPer && x.haftungsdatum);
  const avg=zu.length? Math.round(zu.map(x=>Math.max(0,diffT(x.haftungsdatum,x.vermietetPer)-1))
             .reduce((p,q)=>p+q,0)/zu.length) : null;
  return {name, gesamt:f.length, offen:offen.length, aufgaben:a.length,
          crit:crit.length, aeltest, avg,
          zurueck:a.filter(x=>x.zurueck).length};
}
function viewLeitung(){
  const zeilen=BEWIRTSCHAFTER.map(teamZeile).sort((a,b)=> b.crit-a.crit || b.offen-a.offen);
  const alleAufgaben=aufgaben(FAELLE);
  const dringend=alleAufgaben.filter(a=>a.stufe==="crit"||a.stufe==="warn").slice(0,8);
  return `
  <div class="spread" style="margin-bottom:16px">

      <p class="tiny muted" style="margin:3px 0 0">${esc(ST.ich)} · ${esc(ROLLEN[ST.rolle].t)} · Stand ${fmt(iso(HEUTE))}</p></div>
    <div class="row">${darfAnlegen()?durcharbeitenBtn(alleAufgaben.filter(a=>!a.zurueck).length,"Team-Aufgaben durcharbeiten"):""}</div>
  </div>

  ${kpiBlock(FAELLE)}

  <h2 style="margin:20px 0 9px">Arbeitsbereiche</h2>
  ${bereichKacheln(FAELLE)}

  <div class="panel" style="margin-top:18px">
    <header><span class="lbl">Mitarbeiter</span>
      <span class="tiny muted">Zeile anklicken, um den Arbeitsvorrat zu öffnen</span></header>
    <div class="tablewrap"><table>
      <thead><tr><th>Bewirtschafter</th><th class="n">Offene Fälle</th><th class="n">Aufgaben</th>
        <th class="n">Dringend</th><th class="n">Längste Überschreitung</th>
        <th class="n">Ø Leerstand</th><th></th></tr></thead>
      <tbody>${zeilen.map(z=>`<tr class="klick" data-mitarbeiter="${esc(z.name)}">
        <td><b>${esc(z.name)}</b>${z.zurueck?' <span class="chip n">'+z.zurueck+' zurückgestellt</span>':""}</td>
        <td class="n">${z.offen}</td>
        <td class="n">${z.aufgaben}</td>
        <td class="n" ${z.crit?'style="color:var(--crit);font-weight:600"':""}>${z.crit}</td>
        <td class="n">${z.aeltest?z.aeltest+" T.":"–"}</td>
        <td class="n">${z.avg==null?"–":z.avg}</td>
        <td class="n"><span class="muted">öffnen →</span></td></tr>`).join("")}</tbody>
    </table></div>
  </div>

  <div class="panel" style="margin-top:14px">
    <header><span class="lbl">Handlungsbedarf im Team</span>
      <span class="tiny muted">${dringend.length} von ${alleAufgaben.length} Aufgaben</span></header>
    <div class="tasks">${aufgabenZeilen(dringend, true)}</div>
  </div>`;
}

/* ============================================================
   7d · ANSICHT: EINZELNER MITARBEITER
   ============================================================ */
function viewMitarbeiter(){
  const name=ST.mitarbeiter;
  const basis=faelleVon(name);
  const a=aufgaben(basis);
  return `
  <button class="crumb" data-nav-to="dashboard" style="margin-bottom:10px">← Teamübersicht</button>
  <div class="spread" style="margin-bottom:16px">
    <div><h1>${esc(name)}</h1>
      <p class="tiny muted" style="margin:3px 0 0">Bewirtschaftung · ${basis.length} Fälle insgesamt</p></div>
    <div class="row">
      ${darfAnlegen()?durcharbeitenBtn(a.filter(x=>!x.zurueck).length,"Aufgaben durcharbeiten"):""}
      <button class="btn" data-setbew="${esc(name)}">Fälle filtern</button>

  <h2 style="margin:20px 0 9px">Arbeitsbereiche</h2>

    <header><span class="lbl">Aufgaben</span><span class="tiny muted">nach Dringlichkeit</span></header>
    <div class="tasks">${aufgabenZeilen(a, false)}</div>

}

/* ============================================================
   7e · ANSICHT: ARBEITSBEREICH
   ============================================================ */
function viewBereich(){
  const b=BEREICH(ST.bereich)||BEREICHE[0];
  const basis=ST.mitarbeiter?faelleVon(ST.mitarbeiter):sichtFaelle();
  const a=aufgaben(basis,{bereich:b.k});
  const faelle=basis.filter(f=>!f.abgeschlossen && bereichVonFall(f)===b.k);
  const zeigeName = ST.rolle!=="bewirtschafter" || ST.sicht==="team";
  return `
  <div class="spread" style="margin-bottom:6px">
    <div>
      <h1>${esc(b.titel)}</h1>
      <p class="tiny muted" style="margin:3px 0 0">${esc(b.zweck)}
        <span class="excel">Excel ${esc(b.excel)}</span></p>
    </div>
    <div class="row">${darfAnlegen()?durcharbeitenBtn(a.filter(x=>!x.zurueck).length):""}</div>
  </div>
  <div class="row" style="margin:12px 0 16px">
    ${ST.mitarbeiter?`<span class="chip acc">nur ${esc(ST.mitarbeiter)}
      <button class="chipx" data-mitarbeiter-weg>×</button></span>`:""}
    ${ST.rolle==="bewirtschafter"?`<div class="seg" role="group" aria-label="Sicht">
      <button data-sicht="meine" aria-pressed="${ST.sicht==="meine"}">Meine Fälle</button>
      <button data-sicht="team" aria-pressed="${ST.sicht==="team"}">Team</button></div>`:""}
    <span class="tiny muted">${faelle.length} ${faelle.length===1?"Fall":"Fälle"} in diesem Bereich ·
      ${a.filter(x=>x.stufe==="crit").length} dringend</span>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><span class="lbl">Aufgaben in diesem Bereich</span>
      <span class="tiny muted">nach Dringlichkeit</span></header>
    <div class="tasks">${aufgabenZeilen(a, zeigeName)}</div>
  </div>

  <div class="panel">
    <header><span class="lbl">Fälle in diesem Bereich</span><span class="tiny muted">${faelle.length}</span></header>
    <div class="cases">${faelle.length?faelle.map(f=>fallZeile(f)).join(""):'<div class="empty">Keine Fälle in diesem Bereich.</div>'}</div>
  </div>`;
}

/* ============================================================
   8 · ANSICHT: DASHBOARD
   ============================================================ */
function viewDashboard(){
  if(istLeitung() || ST.rolle==="lesend") return viewLeitung();
  const basis=sichtFaelle();
  const auf=aufgaben(basis);
  const aktiv=auf.filter(a=>!a.zurueck);
  const offen=basis.filter(f=>!f.abgeschlossen);
  const warnRows=[];
  offen.forEach(f=>warnungen(f).filter(w=>w.stufe!=="info").forEach(w=>warnRows.push({f,w})));
  const seen=new Set();
  const warnU=warnRows.filter(r=>{ const k=r.f.id+"|"+r.w.titel; if(seen.has(k))return false; seen.add(k); return true; });
  warnU.sort((a,b)=> (a.w.stufe==="crit"?0:1)-(b.w.stufe==="crit"?0:1));
  const nurLesen = ST.rolle==="lesend";

  return `
  <div class="spread" style="margin-bottom:16px">
    <div>
      <h1>${nurLesen?"Übersicht":"Mein Arbeitstag"}</h1>
      <p class="tiny muted" style="margin:3px 0 0">${esc(ST.ich)} · ${esc(ROLLEN[ST.rolle].t)} ·
        Stand ${fmt(iso(HEUTE))} · ${ST.sicht==="meine"?"meine Fälle":"alle Bewirtschafter"}</p>
    </div>
    <div class="row">
      ${ST.rolle==="bewirtschafter"?`<div class="seg" role="group" aria-label="Sicht">
        <button data-sicht="meine" aria-pressed="${ST.sicht==="meine"}">Meine Fälle</button>
        <button data-sicht="team" aria-pressed="${ST.sicht==="team"}">Team</button>
      </div>`:""}
      ${nurLesen?"":durcharbeitenBtn(aktiv.length)}
    </div>
  </div>

  ${kpiBlock(basis)}

  <h2 style="margin:20px 0 9px">Arbeitsbereiche</h2>
  ${bereichKacheln(basis)}

  <div class="panel" style="margin:18px 0 16px">
    <header>
      <span class="lbl">${nurLesen?"Offene Aufgaben":"Meine Aufgaben"}</span>
      <span class="tiny muted">${aktiv.length} offen${auf.length-aktiv.length?" · "+(auf.length-aktiv.length)+" zurückgestellt":""} · nach Dringlichkeit</span>
    </header>
    <div class="tasks">${aufgabenZeilen(auf.slice(0,9), ST.sicht==="team")}</div>
    ${auf.length>9?`<div class="pad" style="padding:10px 15px;border-top:1px solid var(--line)">
      <button class="btn ghost sm" data-nav-to="faelle">Alle ${auf.length} Aufgaben in der Fallliste ansehen →</button></div>`:""}
  </div>

  <div class="panel">
    <header><span class="lbl">Warnungen &amp; Prüfungen</span>
      <span class="tiny muted">laufend geprüft</span></header>
    <div class="warn-list">
      ${warnU.length? warnU.slice(0,8).map(r=>`
      <div class="wrow ${r.w.stufe}">
        <span class="ic">${r.w.stufe==="crit"?"!":"▲"}</span>
        <div><b class="f-ui" style="font-size:13.5px">${esc(r.w.titel)}</b>
          <div class="w2">${esc(objekt(r.f.objektId).nr)} · ${esc(objLabel(r.f.objektId))} — ${esc(r.w.text)}</div></div>
        <button class="btn sm" data-open="${r.f.id}">Prüfen</button>
      </div>`).join("")
      : '<div class="wrow ok"><span class="ic">✓</span><div><b class="f-ui" style="font-size:13.5px">Keine Auffälligkeiten</b><div class="w2">Alle Daten plausibel, keine Fristen verstrichen.</div></div><span></span></div>'}
    </div>
  </div>

  <div class="row" style="margin-top:16px">
    ${darfAnlegen()?'<button class="btn pri" id="btnNeu2">+ Neuer Fall</button>':""}
    <button class="btn" data-nav-to="faelle">Alle Fälle</button>
    <button class="btn" data-nav-to="auswertung">Auswertung</button>
  </div>`;
}

/* ============================================================
   9 · ANSICHT: FALLLISTE
   ============================================================ */
function gefiltert(){
  const q=ST.q.trim().toLowerCase();
  return FAELLE.filter(f=>{
    if(ST.fBew && f.bewirtschafter!==ST.fBew) return false;
    if(ST.fStatus==="offen" && f.abgeschlossen) return false;
    if(ST.fStatus==="zu" && !f.abgeschlossen) return false;
    if(ST.fPhase && String(aktuellePhase(f))!==ST.fPhase) return false;
    if(ST.fUeber && !istUeberfaellig(f)) return false;
    if(q){
      const o=objekt(f.objektId), l=lig(o.lig);
      const hay=[f.id,o.nr,l.name,l.ort,l.eig,f.exMieter,f.neuerMieter,f.bewirtschafter,o.stock].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>{
    const ua=istUeberfaellig(a)?0:1, ub=istUeberfaellig(b)?0:1;
    if(ua!==ub) return ua-ub;
    const la=leerstand(a), lb=leerstand(b);
    return (lb?lb.tage:0)-(la?la.tage:0);
  });
}
function fallZeile(f){
  const o=objekt(f.objektId), l=lig(o.lig), n=naechsterSchritt(f);
  const br=bereichVonFall(f);
  return `<button class="case" data-open="${f.id}">
    <div class="c-obj"><div class="nr">${esc(o.nr)}</div><div class="s2">${esc(f.id)}</div></div>
    <div class="c-lig"><div class="ln">${esc(l.name)}, ${esc(o.stock)}</div>
      <div class="s2">${esc(l.ort)} · ${o.zi.toFixed(1).replace(".",",")} Zi. · ${esc(f.bewirtschafter)}</div></div>
    <div class="c-mieter"><div class="s2" style="color:var(--ink)">ex ${esc(f.exMieter||"—")}</div>
      <div class="s2">${f.neuerMieter?"neu "+esc(f.neuerMieter):(n?esc(n.titel):"—")}</div></div>
    <div class="c-phase">${phaseBar(f)}<div class="s2" style="margin-top:4px">${f.abgeschlossen
        ?"abgeschlossen "+fmtKurz(f.abgeschlossen.am)
        :esc(BEREICH(br).titel)+" · Phase "+aktuellePhase(f)}</div></div>
    <div class="rt"><div class="nr num">${leerstandText(f)}</div><div style="margin-top:4px">${statusChip(f)}</div></div>
  </button>`;
}
function viewFaelle(){
  const list=gefiltert();
  return `
  <div class="spread" style="margin-bottom:14px">
    <div><h1>Fälle</h1>
      <p class="tiny muted" style="margin:3px 0 0">${list.length} von ${FAELLE.length} Fällen</p></div>
    <div class="row">
      <button class="btn" id="btnExport">Export</button>
      <button class="btn pri" id="btnNeu2">+ Neuer Fall</button>
    </div>
  </div>

  <div class="flat pad" style="padding:12px 14px;margin-bottom:14px">
    <div class="row">
      <div class="field" style="flex:1 1 230px"><label for="fq">Suche</label>
        <input id="fq" type="text" value="${esc(ST.q)}" placeholder="Obj.-Nr., Liegenschaft, Mieter, Eigentümer …"></div>
      <div class="field" style="flex:0 1 165px"><label for="fbew">Bewirtschafter</label>
        <select id="fbew"><option value="">alle</option>
        ${BEWIRTSCHAFTER.map(b=>`<option value="${b}" ${ST.fBew===b?"selected":""}>${b}</option>`).join("")}</select></div>
      <div class="field" style="flex:0 1 150px"><label for="fph">Phase</label>
        <select id="fph"><option value="">alle</option>
        ${PHASEN.map(p=>`<option value="${p.nr}" ${ST.fPhase===String(p.nr)?"selected":""}>${p.nr} · ${p.titel}</option>`).join("")}</select></div>
      <div class="field" style="flex:0 1 128px"><label for="fst">Status</label>
        <select id="fst">
          <option value="offen" ${ST.fStatus==="offen"?"selected":""}>offen</option>
          <option value="zu" ${ST.fStatus==="zu"?"selected":""}>abgeschlossen</option>
          <option value="" ${ST.fStatus===""?"selected":""}>alle</option>
        </select></div>
      <label class="row tiny" style="gap:6px;align-self:flex-end;padding-bottom:8px;cursor:pointer">
        <input type="checkbox" id="fue" ${ST.fUeber?"checked":""} style="width:auto"> nur überfällige</label>
    </div>
  </div>

  <div class="panel">
    <div class="cases">
      ${list.length? list.map(fallZeile).join("")
      : '<div class="empty">Keine Fälle für diese Filter. <button class="btn ghost sm" id="btnFilterReset">Filter zurücksetzen</button></div>'}
    </div>
  </div>
  <p class="note" style="margin-top:10px">Sortierung: überfällige Fälle zuerst, danach nach Leerstandstagen absteigend.</p>`;
}

/* ============================================================
   10 · ANSICHT: FALLAKTE
   ============================================================ */
function feldZeile(f,feld,label,typ){
  const v=f[feld]||"";
  return `<div class="field">
    <label for="fl_${feld}">${esc(label)} ${hilfeBtn(feld)}</label>
    <input id="fl_${feld}" type="${typ}" value="${esc(v)}" data-feld="${feld}" data-fall="${f.id}"
      ${darfBearbeiten(f)?"":"disabled"}>
    <div class="helptext" id="hlp_${feld}" hidden>${esc(FELDHILFE[feld]||"")}</div>
  </div>`;
}
function schrittZeile(f,s){
  const st=f.schritte[s.k];
  const zu=!!f.abgeschlossen || !darfBearbeiten(f);
  const tv=terminVon(f,s), soll=istSoll(f,s);
  const rest = st.status==="offen" && tv ? seitHeute(tv) : null;
  const ueber = rest!==null && rest>0;
  const cls = st.status==="erledigt"?"done":st.status==="na"?"na":(ueber?"over":"");
  let meta="offen";
  if(st.status==="erledigt") meta=`erledigt ${fmt(st.datum)} · ${esc(st.von||"")}`;
  else if(st.status==="na") meta=`nicht erforderlich · ${esc(st.grund||"")}`;
  else if(tv){
    const bezug = soll ? "Sollfrist "+fmt(tv)+" · "+esc(s.soll.txt) : "Termin "+fmt(tv);
    meta = rest>0  ? `<span style="color:var(--crit);font-weight:600">${bezug} · ${rest} T. überschritten</span>`
         : rest===0? `<span style="color:var(--warn);font-weight:600">${bezug} · heute fällig</span>`
         : `${bezug} · in ${-rest} T.`;
  }
  return `<div class="step ${cls}">
    <span class="mark">${st.status==="erledigt"?"✓":st.status==="na"?"–":ueber?"!":""}</span>
    <div>
      <div class="sl">${esc(schrittTitel(f,s))}
        ${s.sys?`<span class="sys s-${s.sys}" title="${esc(SYSTEME[s.sys].h)}">${esc(SYSTEME[s.sys].t)}</span>`:""}
        <span class="excel" title="Spalte im Excel">${esc(s.sp)}</span> ${hilfeBtn("s_"+s.k)}</div>
      <div class="meta">${meta}</div>
      <div class="helptext" id="hlp_s_${s.k}" hidden style="margin-top:6px">${esc(s.h)}</div>
    </div>
    <div class="acts">
      ${s.termin&&!zu?`<input type="date" id="trm_${s.k}" aria-label="${esc(s.tl||"Termin")}"
        value="${esc(st.termin||"")}" data-termin="${s.k}" data-fall="${f.id}"
        title="${soll?"Sollfrist "+fmt(tv)+" – eigenen Termin setzen":esc(s.tl||"Termin")}">`:""}
      ${zu?"":st.status==="offen"
        ? `<button class="btn sm pri" data-do="${s.k}" data-fall="${f.id}">Erledigen</button>
           <button class="btn sm ghost" data-na="${s.k}" data-fall="${f.id}" title="Schritt entfällt bei diesem Fall">nicht nötig</button>`
        : `<button class="btn sm ghost" data-undo="${s.k}" data-fall="${f.id}">rückgängig</button>`}
    </div>
  </div>`;
}
function viewFall(){
  const f=fall(ST.fallId);
  if(!f) return '<div class="empty">Fall nicht gefunden. <button class="btn ghost sm" data-nav-to="faelle">Zur Fallliste</button></div>';
  const o=objekt(f.objektId), l=lig(o.lig);
  const n=naechsterSchritt(f), ws=warnungen(f), ls=leerstand(f), vl=vorlauftage(f), cur=aktuellePhase(f);

  const inQueue = !!(ST.queue && ST.queue[ST.qIdx]===f.id);
  const bearbeitbar = darfBearbeiten(f);
  const wv = f.wiedervorlage && seitHeute(f.wiedervorlage.datum)<0 ? f.wiedervorlage : null;

  return `
  ${inQueue?`<div class="qbar">
    <div class="qtxt"><b>Durcharbeiten</b> · Aufgabe ${ST.qIdx+1} von ${ST.queue.length}
      <span class="qprog"><span style="width:${Math.round((ST.qIdx+1)/ST.queue.length*100)}%"></span></span></div>
    <div class="qacts">
      <button class="btn sm" data-q="-1" ${ST.qIdx===0?"disabled":""}>← Zurück</button>
      ${bearbeitbar?`<button class="btn sm" data-defer="${f.id}">Später · 3 Tage</button>`:""}
      <button class="btn sm" data-q="1">Weiter →</button>
      <button class="btn sm ghost" data-qend>Beenden</button>
    </div>
  </div>`:`<button class="crumb" data-nav-to="faelle" style="margin-bottom:10px">← Fälle</button>`}

  ${bearbeitbar?"":`<div class="banner warn" style="margin-bottom:12px"><span>▲</span><div>
    ${ST.rolle==="lesend"
      ? "Sie sind leseberechtigt. Fälle lassen sich ansehen und exportieren, aber nicht ändern."
      : "Zuständig ist <b>"+esc(f.bewirtschafter)+"</b>. Sie sehen den Fall, bearbeiten kann ihn die zuständige Person oder die Teamleitung."}
  </div></div>`}

  ${wv?`<div class="banner info" style="margin-bottom:12px"><span>ℹ</span><div>
    Zurückgestellt bis <b>${fmt(wv.datum)}</b> durch ${esc(wv.von)}.
    ${bearbeitbar?'<button class="btn sm ghost" data-wvweg="'+f.id+'" style="margin-left:8px">Jetzt wieder aufnehmen</button>':""}
  </div></div>`:""}
  <div class="spread" style="margin-bottom:14px">
    <div style="min-width:0">
      <h1>${esc(l.name)}, ${esc(o.stock)}</h1>
      <p class="tiny muted" style="margin:4px 0 0">
        <span class="nr">${esc(o.nr)}</span> · ${esc(l.ort)} · ${o.zi.toFixed(1).replace(".",",")} Zimmer · ${esc(l.eig)}</p>
    </div>
    <div class="row">
      ${statusChip(f)}
      <span class="chip acc">${esc(BEREICH(bereichVonFall(f)).titel)}</span>
      ${darfZuweisen()&&!f.abgeschlossen
        ? `<span class="zuw"><label for="zustaendig" class="lbl">Zuständig</label>
           <select id="zustaendig" data-fall="${f.id}">${BEWIRTSCHAFTER.map(b=>
             `<option ${b===f.bewirtschafter?"selected":""}>${esc(b)}</option>`).join("")}</select></span>`
        : `<span class="chip n">${esc(f.bewirtschafter)}</span>`}
      <span class="chip n">${esc(f.id)}</span>
    </div>
  </div>

  <div class="metrics" style="margin-bottom:14px">
    <div class="metric"><span class="lbl">Leerstandstage</span>
      <div class="v ${ls&&ls.laufend&&!ls.kuenftig&&ls.tage>60?"crit":""}">${ls?(ls.kuenftig?"0":ls.tage):"–"}</div>
      <div class="tiny muted">${ls? (ls.kuenftig? (ls.bisBeginn===1?"beginnt morgen":"beginnt in "+ls.bisBeginn+" Tagen") : (ls.laufend?"leer seit "+fmtKurz(ls.beginn):fmtKurz(ls.beginn)+"–"+fmtKurz(ls.ende))) : "Haftungsdatum fehlt"}</div></div>
    <div class="metric"><span class="lbl">Vorlauftage</span>
      <div class="v">${vl==null?"–":vl}</div>
      <div class="tiny muted">Kündigung → Ende Mieterhaftung</div></div>
    <div class="metric"><span class="lbl">Berichtsmonat</span>
      <div class="v" style="font-size:15px;padding-top:4px">${esc(berichtsmonat(f.haftungsdatum))}</div>
      <div class="tiny muted">aus Leerstandsbeginn</div></div>
    <div class="metric"><span class="lbl">Tage in Phase ${f.abgeschlossen?"–":cur}</span>
      <div class="v">${f.abgeschlossen?"–":tageInPhase(f)}</div>
      <div class="tiny muted">${f.abgeschlossen?"abgeschlossen "+fmtKurz(f.abgeschlossen.am):esc(PHASEN[cur-1].titel)}</div></div>
  </div>

  ${n?`<div class="next ${n.art==="abschluss"?"done":""}" style="margin-bottom:14px">
    <div style="min-width:0">
      <span class="k">Nächster Schritt · ${esc(BEREICH(bereichVonFall(f)).titel)}</span>
      <h3>${esc(n.titel)}${n.art==="schritt"&&n.schritt.sys?` <span class="sys s-${n.schritt.sys}">${esc(SYSTEME[n.schritt.sys].t)}</span>`:""}</h3>
      <p>${n.text}</p>
      ${n.art==="schritt"&&n.schritt.sys?`<p class="note" style="margin-top:6px">${esc(SYSTEME[n.schritt.sys].h)}</p>`:""}
    </div>
    <div class="acts">
      ${!bearbeitbar?"":`
      ${n.art==="schritt"&&n.terminSetzen?`<button class="btn pri" data-termin-focus="${n.schritt.k}">Termin vereinbaren</button>`:""}
      ${n.art==="schritt"&&!n.terminSetzen?`<button class="btn pri" data-do="${n.schritt.k}" data-fall="${f.id}">Erledigen</button>`:""}
      ${n.art==="abschluss"?`<button class="btn pri" data-close="${f.id}">Fall abschliessen</button>`:""}
      ${n.art==="feld"?`<button class="btn pri" data-focus="${n.felder[0].f}">Zur Angabe</button>`:""}`}
    </div>
  </div>`:`<div class="next done" style="margin-bottom:14px">
    <div><span class="k">Erledigt</span><h3>Fall abgeschlossen am ${fmt(f.abgeschlossen.am)}</h3>
    <p>Abgeschlossen durch ${esc(f.abgeschlossen.von)} · alle fünf Phasen vollständig.</p></div>
    <div class="acts">${bearbeitbar?`<button class="btn" data-reopen="${f.id}">Wieder öffnen</button>`:""}</div>
  </div>`}

  ${ws.length?`<div class="panel" style="margin-bottom:14px"><header><span class="lbl">Prüfungen zu diesem Fall</span></header>
    <div class="warn-list">${ws.map(w=>`<div class="wrow ${w.stufe}">
      <span class="ic">${w.stufe==="crit"?"!":w.stufe==="warn"?"▲":"i"}</span>
      <div><b class="f-ui" style="font-size:13.5px">${esc(w.titel)}</b><div class="w2">${esc(w.text)}</div></div>
      ${w.fall?`<button class="btn sm" data-open="${w.fall}">Anderen Fall öffnen</button>`:"<span></span>"}
    </div>`).join("")}</div></div>`:""}

  <div class="detail">
    <div>
      ${PHASEN.map(p=>{
        const komplett=phaseKomplett(f,p.nr);
        const offenAnz=SCHRITTE_P(p.nr).filter(s=>f.schritte[s.k].status==="offen").length
                     + fehlendeFelder(f,p.nr).length;
        const open = !f.abgeschlossen && p.nr===cur;
        return `<details class="phase" ${open?"open":""}>
          <summary>
            <span class="pnum p${p.nr}">${komplett?"✓":p.nr}</span>
            <span class="ptitle">${esc(p.titel)}</span>
            <span class="excel">${esc(p.excel)}</span>

function phaseEnde(f,n){
  if(n===1) return f.gekuendigtPer||f.angelegtAm;
  const ds=SCHRITTE_P(n).map(s=>f.schritte[s.k].datum).filter(Boolean).sort();
  return ds.length?ds[ds.length-1]:null;
}
function durchlauf(f,n){
  const e=phaseEnde(f,n); if(!e) return null;
  let s=null; for(let m=n-1;m>=1;m--){ s=phaseEnde(f,m); if(s) break; }
  if(!s) return null;
  const d=diffT(s,e); return d==null?null:Math.max(0,d);
}
function kennzahlen(bew){
  const alle=FAELLE.filter(f=>f.bewirtschafter===bew);
  const offen=alle.filter(f=>!f.abgeschlossen);
  const ueber=offen.filter(istUeberfaellig).length;
  const zu=alle.filter(f=>f.abgeschlossen && f.vermietetPer && f.haftungsdatum && f.gekuendigtPer);
  const mit=(start,abzug)=>{ if(!zu.length) return null;
    const v=zu.map(f=>diffT(f[start],f.vermietetPer)-abzug).filter(x=>x!=null).map(x=>Math.max(0,x));
    return v.length? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; };
  return {bew, gesamt:alle.length, offen:offen.length, ueber,
          avgNeu:mit("haftungsdatum",1),    // leere Tage ab Folgetag des Haftungsdatums
          avgExcel:mit("gekuendigtPer",0),  // wörtlich wie im Excel: Vermietet per minus gekündigt per
          zuAnz:zu.length};
}
function viewAuswertung(){
  const rows=BEWIRTSCHAFTER.map(kennzahlen);
  const tot={gesamt:rows.reduce((s,r)=>s+r.gesamt,0), offen:rows.reduce((s,r)=>s+r.offen,0),
             ueber:rows.reduce((s,r)=>s+r.ueber,0)};
  const zuAlle=FAELLE.filter(f=>f.abgeschlossen && f.vermietetPer && f.haftungsdatum);
  const avgT=zuAlle.length?Math.round(zuAlle.map(f=>Math.max(0,diffT(f.haftungsdatum,f.vermietetPer)-1)).reduce((a,b)=>a+b,0)/zuAlle.length):null;
  const avgX=zuAlle.length?Math.round(zuAlle.map(f=>diffT(f.gekuendigtPer,f.vermietetPer)).reduce((a,b)=>a+b,0)/zuAlle.length):null;
  const maxOffen=Math.max(1,...rows.map(r=>r.offen));

  const dl=[2,3,4,5].map(n=>{
    const v=FAELLE.filter(f=>f.abgeschlossen).map(f=>durchlauf(f,n)).filter(x=>x!=null);
    return {n, titel:PHASEN[n-1].titel, avg: v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null, anz:v.length};
  });
  const maxDl=Math.max(1,...dl.map(d=>d.avg||0));

  const offeneF=FAELLE.filter(f=>!f.abgeschlossen);
  const jePhase=[1,2,3,4,5].map(n=>({n, titel:PHASEN[n-1].titel, anz:offeneF.filter(f=>aktuellePhase(f)===n).length}));
  const sumPh=Math.max(1,offeneF.length);

  return `

      <tfoot><tr><td>Gesamt</td><td class="n">${tot.gesamt}</td><td class="n">${tot.offen}</td>
        <td class="n">${tot.ueber}</td><td class="n">${avgT==null?"–":avgT}</td>

  <div class="grid2" style="align-items:start">

      <div class="pad"><div class="bars">

          <span class="v">${r.offen}</span></div>`).join("")}

      <p class="note" style="margin-top:10px">Rot eingefärbt: Bewirtschafter mit mindestens einem überfälligen Termin.</p></div></div>
