<title>Vermietungspilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F5F4FA; --surface:#FFFFFF; --surface-2:#FBFAFE; --sunken:#EEECF7;
  --ink:#1B1730; --ink-2:#5D5875; --ink-3:#8B86A0;
  --line:#E1DEEF; --line-strong:#CBC6E2;
  --accent:#4B3FA6; --accent-ink:#392E85; --accent-soft:#EEEBFA; --on-accent:#FFFFFF;
  --agent:#4B3FA6; --agent-soft:#EEEBFA;
  --ok:#2F6B45; --ok-soft:#E3F0E8;
  --warn:#8A5A0B; --warn-soft:#FAEEDA;
  --crit:#A3312B; --crit-soft:#F8E4E2;
  --shadow:0 1px 2px rgba(27,23,48,.06), 0 4px 16px rgba(27,23,48,.06);
  --r:8px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#161226; --surface:#1F1A34; --surface-2:#241E3B; --sunken:#191430;
  --ink:#ECEAF7; --ink-2:#B0AAC8; --ink-3:#837C9C;
  --line:#332C50; --line-strong:#453B69;
  --accent:#9C90E8; --accent-ink:#C3B9F5; --accent-soft:#2A2348; --on-accent:#15102A;
  --agent:#9C90E8; --agent-soft:#2A2348;
  --ok:#7BC496; --ok-soft:#1A3326;
  --warn:#E0A950; --warn-soft:#382A12;
  --crit:#EB8B83; --crit-soft:#3A1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#161226; --surface:#1F1A34; --surface-2:#241E3B; --sunken:#191430;
  --ink:#ECEAF7; --ink-2:#B0AAC8; --ink-3:#837C9C;
  --line:#332C50; --line-strong:#453B69;
  --accent:#9C90E8; --accent-ink:#C3B9F5; --accent-soft:#2A2348; --on-accent:#15102A;
  --agent:#9C90E8; --agent-soft:#2A2348;
  --ok:#7BC496; --ok-soft:#1A3326;
  --warn:#E0A950; --warn-soft:#382A12;
  --crit:#EB8B83; --crit-soft:#3A1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.f-ui{font-family:Archivo,"Segoe UI",system-ui,sans-serif;text-wrap:balance}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:15.5px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important} }

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .ic{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#8B7FE0));display:grid;place-items:center;flex:none}
.brand .ic svg{width:16px;height:16px}
.brand b{font-family:Archivo;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--ink-3)}
.wrap{max-width:1220px;margin:0 auto;padding:22px 22px 70px}
@media (max-width:720px){ .wrap{padding:16px 14px 56px} .topbar{padding:10px 16px} }

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.kpi .v{font-family:Archivo;font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--ink-3)}
.kpi.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#7A6EDD));color:#fff;border:0}
.kpi.hero .lbl{color:rgba(255,255,255,.75)}
.kpi.hero .foot{color:rgba(255,255,255,.75)}

/* ---------- layout: liste + detail ---------- */
.board{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){ .board{grid-template-columns:1fr} }
.caselist{display:flex;flex-direction:column;gap:10px}
.case{display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);color:inherit;width:100%}
.case:hover{border-color:var(--accent)}
.case[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.case .adr{font-family:Archivo;font-weight:600;font-size:14px}
.case .ort{font-size:12px;color:var(--ink-2)}
.case .foot{display:flex;align-items:center;gap:8px;margin-top:2px}
@media (max-width:880px){ .caselist.is-hidden{display:none} }
@media (min-width:881px){ .backlink{display:none} }

/* ---------- status pill mit puls ---------- */
.stat{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:20px;font-family:Archivo;font-size:11px;font-weight:600;white-space:nowrap}
.stat .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.stat.sammelt{background:var(--agent-soft);color:var(--agent)}
.stat.sammelt .dot{animation:puls 1.8s ease-in-out infinite}
.stat.rankt{background:var(--agent-soft);color:var(--agent)}
.stat.rankt .dot{animation:puls 1.8s ease-in-out infinite}
.stat.freigabe{background:var(--warn-soft);color:var(--warn)}
.stat.abgeschlossen{background:var(--ok-soft);color:var(--ok)}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- detail ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header .lbl{margin-right:auto}
.panel .pad{padding:16px}
.dhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dhead .obj{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.autonomie{display:flex;flex-direction:column;gap:4px;min-width:230px}
.autonomie select{width:100%;padding:6px 9px;font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:12.5px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface)}
.autonomie .expl{font-size:11.5px;color:var(--ink-3);line-height:1.4}

/* ---------- aktivitätsprotokoll ---------- */
.feed{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:30px 1fr;gap:11px;padding:12px 16px;border-top:1px solid var(--line)}
.feed .entry:first-child{border-top:0}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.av.agent{background:var(--agent-soft);color:var(--agent)}
.av.verwalter{background:var(--sunken);color:var(--ink-2)}
.av.system{background:var(--sunken);color:var(--ink-3)}
.av svg{width:14px;height:14px}
.entry .who{font-family:Archivo;font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;gap:7px;align-items:baseline}
.entry .txt{font-size:13.5px;margin-top:2px;line-height:1.5}
.entry .zeit{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.entry.offen{background:var(--warn-soft)}
.entry .acts{display:flex;gap:8px;margin-top:9px}

/* ---------- kandidaten ---------- */
.kandidaten{display:flex;flex-direction:column;gap:10px}
.kand{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;background:var(--surface-2)}
.kand .score{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:Archivo;font-weight:700;font-size:14px;flex:none;color:#fff}
.kand .body{flex:1;min-width:0}
.kand .name{font-family:Archivo;font-weight:600;font-size:14px}
.kand .begr{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.kand .side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.archiv{font-size:12.5px;color:var(--ink-3);padding:9px 2px 2px;border-top:1px dashed var(--line);margin-top:2px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-family:Archivo;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2);font-weight:500}
.btn.ghost:hover{background:var(--sunken)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-family:Archivo;font-size:11px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.n{background:var(--sunken);color:var(--ink-2)}
[hidden]{display:none!important}
</style>
<div id="app"></div>
<script>
/* ================= Zeit ================= */
const MIN=60000, STD=60*MIN, TAG=24*STD;
const JETZT=new Date();
function relZeit(minVor){
  const d=JETZT.getTime()-minVor*MIN;
  const diffMin=minVor;
  let txt;
  if(diffMin<60) txt="vor "+Math.max(1,Math.round(diffMin))+" Min.";
  else if(diffMin<24*60) txt="vor "+Math.round(diffMin/60)+" Std.";
  else txt="vor "+Math.round(diffMin/(24*60))+" Tagen";
  return txt;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= Icons ================= */
const ICO_BLITZ='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-8z"/></svg>';
const ICO_PERSON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg>';
const ICO_MAIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
const ICO_HAKEN='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg>';

/* ================= Daten ================= */
function scoreFarbe(s){ return s>=85?"var(--ok)":s>=65?"var(--accent)":"var(--warn)"; }
let FAELLE=[
  {
    id:"f1", status:"sammelt", autonomie:"mittel",
    objekt:{adresse:"Bahnhofstrasse 12", ort:"8001 Zürich", zi:"3.5 Zimmer", miete:2180},
    kuendigungVor: 3*24*60,
    bewerbungenTotal:0,
    log:[
      {min:3*24*60, akteur:"system", art:"info", txt:"Kündigung per Ende Monat im Verwaltungssystem erfasst."},
      {min:3*24*60-40, akteur:"agent", art:"auto", txt:"Exposé aus Objektdaten und bestehenden Fotos automatisch erstellt."},
      {min:3*24*60-55, akteur:"agent", art:"auto", txt:"Inserat auf Flatfox und Homegate publiziert."},
      {min:2*24*60, akteur:"system", art:"info", txt:"Wartet auf eingehende Bewerbungen."},
    ],
    kandidaten:[]
  },
  {
    id:"f2", status:"rankt", autonomie:"mittel",
    objekt:{adresse:"Seefeldstrasse 88", ort:"8008 Zürich", zi:"2.5 Zimmer", miete:1950},
    kuendigungVor: 16*24*60,
    bewerbungenTotal:21,
    log:[
      {min:16*24*60, akteur:"system", art:"info", txt:"Kündigung erfasst."},
      {min:16*24*60-30, akteur:"agent", art:"auto", txt:"Exposé erstellt und auf Flatfox, Homegate publiziert."},
      {min:9*24*60, akteur:"agent", art:"auto", txt:"21 Bewerbungen eingegangen und automatisch geprüft (Einkommen, Betreibungsauszug, Referenzen)."},
      {min:9*24*60-20, akteur:"agent", art:"auto", txt:"4 Kandidat:innen oberhalb der Mindestkriterien identifiziert, 17 weitere archiviert. Begründung je Kandidat unten."},
      {min:6*24*60, akteur:"agent", art:"auto", txt:"Besichtigungstermine per E-Mail an die Top-Kandidat:innen vorgeschlagen."},
      {min:2*24*60, akteur:"agent", art:"auto", txt:"Termin mit L. Meier bestätigt: Do., 17:00 Uhr."},
      {min:5*60, akteur:"agent", art:"auto", txt:"Termin mit A. Njoku bestätigt: Fr., 10:00 Uhr."},
    ],
    kandidaten:[
      {name:"L. Meier", score:94, begr:"Einkommen 3.4× Miete · keine Betreibungen · unbefristete Anstellung seit 4 Jahren · positive Referenz Vorvermieter", termin:"Do., 17:00 Uhr", terminStatus:"bestaetigt"},
      {name:"S. Keller & J. Widmer", score:88, begr:"Gemeinsames Einkommen 3.1× Miete · keine Betreibungen · Referenz beim Vorvermieter ausstehend", termin:"Vorschlag: Mi., 18:00 Uhr", terminStatus:"offen"},
      {name:"A. Njoku", score:81, begr:"Einkommen 2.8× Miete · keine Betreibungen · neue Festanstellung seit 3 Monaten", termin:"Fr., 10:00 Uhr", terminStatus:"bestaetigt"},
      {name:"R. Fischer", score:52, begr:"Einkommen 2.1× Miete · 1 offene Betreibung (Bagatellbetrag) · nicht eingeladen, unterhalb Schwelle", termin:"—", terminStatus:"nicht_eingeladen"},
    ],
    archiviert:17
  },
  {
    id:"f3", status:"freigabe", autonomie:"tief",
    objekt:{adresse:"Marktgasse 5", ort:"8400 Winterthur", zi:"4.5 Zimmer", miete:2690},
    kuendigungVor: 24*24*60,
    bewerbungenTotal:33,
    log:[
      {min:24*24*60, akteur:"system", art:"info", txt:"Kündigung erfasst."},
      {min:24*24*60-25, akteur:"agent", art:"auto", txt:"Exposé erstellt und publiziert."},
      {min:15*24*60, akteur:"agent", art:"auto", txt:"33 Bewerbungen geprüft, 5 Kandidat:innen oberhalb der Mindestkriterien, 28 archiviert."},
      {min:11*24*60, akteur:"agent", art:"auto", txt:"Besichtigungen mit 5 Kandidat:innen koordiniert und durchgeführt."},
      {min:3*24*60, akteur:"agent", art:"auto", txt:"M. Rossi als Top-Kandidat identifiziert: Einkommen 3.6× Miete, keine Betreibungen, ausgezeichnete Referenz."},
      {min:3*24*60-10, akteur:"agent", art:"freigabe-noetig", txt:"Mietvertragsentwurf für M. Rossi vorbereitet. Autonomiestufe „tief“ erfordert Ihre Freigabe vor Versand.", id:"vertrag-f3"},
    ],
    kandidaten:[
      {name:"M. Rossi", score:96, begr:"Einkommen 3.6× Miete · keine Betreibungen · unbefristete Anstellung seit 6 Jahren · ausgezeichnete Referenz Vorvermieter", termin:"durchgeführt", terminStatus:"bestaetigt"},
    ],
    archiviert:28
  },
  {
    id:"f4", status:"abgeschlossen", autonomie:"hoch",
    objekt:{adresse:"Freie Strasse 44", ort:"4051 Basel", zi:"1.5 Zimmer", miete:1420},
    kuendigungVor: 40*24*60,
    bewerbungenTotal:27,
    tageBisVermietung:9,
    log:[
      {min:40*24*60, akteur:"system", art:"info", txt:"Kündigung erfasst."},
      {min:40*24*60-20, akteur:"agent", art:"auto", txt:"Exposé erstellt und publiziert."},
      {min:33*24*60, akteur:"agent", art:"auto", txt:"27 Bewerbungen geprüft, Top-Kandidatin ermittelt, 24 archiviert."},
      {min:32*24*60, akteur:"agent", art:"auto", txt:"Besichtigung koordiniert und durchgeführt."},
      {min:31*24*60, akteur:"agent", art:"auto", txt:"Autonomiestufe „hoch“: Mietvertrag automatisch an T. Brunner versendet."},
      {min:31*24*60-40, akteur:"verwalter", art:"freigegeben", txt:"Vertrag unterschrieben zurückerhalten und archiviert."},
      {min:31*24*60-45, akteur:"system", art:"info", txt:"Fall abgeschlossen: vermietet nach 9 Tagen (Portfolio-Ø ohne Agent: 34 Tage)."},
    ],
    kandidaten:[{name:"T. Brunner", score:91, begr:"Einkommen 3.2× Miete · keine Betreibungen · ausgezeichnete Referenz", termin:"durchgeführt", terminStatus:"bestaetigt"}],
    archiviert:24
  },
];
function fall(id){ return FAELLE.find(f=>f.id===id); }
function statusLabel(s){ return {sammelt:"sammelt Bewerbungen",rankt:"screent & koordiniert",freigabe:"wartet auf Freigabe",abgeschlossen:"vermietet"}[s]; }
const AUTONOMIE={
  hoch:{label:"Volle Autonomie", expl:"Agent handelt bis zum Vertragsversand selbständig – nur die Unterschrift bleibt bei Ihnen."},
  mittel:{label:"Terminkoordination automatisch", expl:"Screening und Terminkoordination laufen automatisch, der Vertragsversand braucht Ihre Freigabe."},
  tief:{label:"Nur Vorschläge", expl:"Der Agent bereitet jeden Schritt vor, jede Kontaktaufnahme braucht Ihre Freigabe."},
};

/* ================= Zustand ================= */
const ST={ auswahl:"f2" };

/* ================= KPIs ================= */
function kpiDaten(){
  const aktive=FAELLE.filter(f=>f.status!=="abgeschlossen").length;
  const wartend=FAELLE.filter(f=>f.log.some(l=>l.art==="freigabe-noetig")).length;
  const abgeschlossen=FAELLE.filter(f=>f.status==="abgeschlossen");
  const oTage=abgeschlossen.length? Math.round(abgeschlossen.reduce((s,f)=>s+f.tageBisVermietung,0)/abgeschlossen.length) : null;
  const autoAktionen=FAELLE.reduce((s,f)=>s+f.log.filter(l=>l.art==="auto").length,0);
  return {aktive,wartend,oTage,autoAktionen};
}

/* ================= Rendern ================= */
function render(){
  const k=kpiDaten();
  const f=fall(ST.auswahl);
  const app=document.getElementById("app");
  app.innerHTML=
  '<div class="topbar"><div class="brand"><span class="ic">'+ICO_BLITZ+'</span><b>Vermietungspilot</b><span class="sub">KI-Agent für die automatisierte Wiedervermietung</span></div></div>'+
  '<div class="wrap">'+
    '<div class="kpis">'+
      '<div class="kpi hero"><span class="lbl">Automatisch erledigt</span><span class="v num">'+k.autoAktionen+'</span><span class="foot">Aktionen · ca. '+Math.round(k.autoAktionen*0.35)+' Std. gespart</span></div>'+
      '<div class="kpi"><span class="lbl">Aktive Fälle</span><span class="v num">'+k.aktive+'</span><span class="foot">in Bearbeitung durch den Agenten</span></div>'+
      '<div class="kpi"><span class="lbl">Wartet auf Freigabe</span><span class="v num">'+k.wartend+'</span><span class="foot">Ihre Entscheidung gefragt</span></div>'+
      '<div class="kpi"><span class="lbl">Ø Tage bis Vermietung</span><span class="v num">'+(k.oTage??"–")+'</span><span class="foot">Portfolio-Ø ohne Agent: 34 Tage</span></div>'+
    '</div>'+
    '<div class="board">'+
      '<div class="caselist'+(f&&window.innerWidth<880?' is-hidden':'')+'" id="caselist">'+FAELLE.map(x=>{
        const offen=x.log.some(l=>l.art==="freigabe-noetig");
        return '<button class="case" data-fall="'+x.id+'" aria-current="'+(x.id===ST.auswahl)+'">'+
          '<span class="adr">'+esc(x.objekt.adresse)+'</span><span class="ort">'+esc(x.objekt.ort)+' · '+esc(x.objekt.zi)+' · CHF '+x.objekt.miete+'</span>'+
          '<span class="foot"><span class="stat '+x.status+'"><span class="dot"></span>'+statusLabel(x.status)+'</span>'+
          (offen?'<span class="chip warn">Freigabe nötig</span>':'')+'</span></button>';
      }).join("")+'</div>'+
      '<div id="detail">'+(f? viewDetail(f) : '<div class="panel pad tiny muted">Fall auswählen.</div>')+'</div>'+
    '</div>'+
  '</div>';
}

function viewDetail(f){
  const a=AUTONOMIE[f.autonomie];
  return '<div class="backlink" style="margin-bottom:10px"><button class="btn ghost sm" data-zurueck>← Alle Fälle</button></div>'+
  '<div class="panel"><div class="pad">'+
    '<div class="dhead"><div><h1>'+esc(f.objekt.adresse)+'</h1><div class="obj">'+esc(f.objekt.ort)+' · '+esc(f.objekt.zi)+' · CHF '+f.objekt.miete+'/Mt. · '+f.bewerbungenTotal+' Bewerbungen total</div></div>'+
      '<div class="autonomie"><label class="lbl">Autonomiegrad</label><select data-autonomie="'+f.id+'">'+
        Object.keys(AUTONOMIE).map(k=>'<option value="'+k+'" '+(k===f.autonomie?"selected":"")+'>'+AUTONOMIE[k].label+'</option>').join("")+
      '</select><span class="expl">'+a.expl+'</span></div></div>'+
    '<span class="stat '+f.status+'" style="margin-bottom:4px"><span class="dot"></span>'+statusLabel(f.status)+'</span>'+
  '</div></div>'+
  '<div class="panel" style="margin-top:14px"><header><span class="lbl">Aktivitätsprotokoll</span></header>'+
    '<div class="feed">'+f.log.slice().sort((x,y)=>x.min-y.min).map(l=>entryHtml(l,f)).join("")+'</div>'+
  '</div>'+
  (f.kandidaten.length? '<div class="panel" style="margin-top:14px"><header><span class="lbl">Kandidat:innen-Ranking</span></header><div class="pad kandidaten">'+
    f.kandidaten.map(kd=>kandHtml(kd)).join("")+
    (f.archiviert? '<div class="archiv">+ '+f.archiviert+' weitere Bewerbungen automatisch unterhalb der Mindestkriterien archiviert (Begründung je Fall im Protokoll oben).</div>' : '')+
  '</div></div>' : '');
}
function entryHtml(l,f){
  const avIcon=l.akteur==="agent"?ICO_BLITZ:l.akteur==="verwalter"?ICO_PERSON:ICO_MAIL;
  const wer=l.akteur==="agent"?"Agent":l.akteur==="verwalter"?"Sie":"System";
  const offen=l.art==="freigabe-noetig";
  return '<div class="entry'+(offen?' offen':'')+'"><span class="av '+l.akteur+'">'+avIcon+'</span><div>'+
    '<div class="who">'+wer+'<span class="zeit">'+relZeit(l.min)+'</span></div>'+
    '<div class="txt">'+esc(l.txt)+'</div>'+
    (offen? '<div class="acts"><button class="btn sm pri" data-freigeben="'+f.id+'|'+l.id+'">Freigeben &amp; senden</button><button class="btn sm ghost">Ändern</button></div>' : '')+
  '</div></div>';
}
function kandHtml(kd){
  const bg=scoreFarbe(kd.score);
  const tChip=kd.terminStatus==="bestaetigt"?'<span class="chip ok">Termin bestätigt</span>':kd.terminStatus==="offen"?'<span class="chip warn">Termin vorgeschlagen</span>':'<span class="chip n">nicht eingeladen</span>';
  return '<div class="kand"><span class="score" style="background:'+bg+'">'+kd.score+'</span><div class="body">'+
    '<div class="name">'+esc(kd.name)+'</div><div class="begr">'+esc(kd.begr)+'</div></div>'+
    '<div class="side">'+tChip+'<span class="tiny muted">'+esc(kd.termin)+'</span>'+
    (kd.terminStatus==="offen"? '<button class="btn sm" data-bestaetigen="'+esc(kd.name)+'">Termin bestätigen</button>':'')+
    '</div></div>';
}

/* ================= Ereignisse ================= */
document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.fall){ ST.auswahl=t.dataset.fall; render(); window.scrollTo(0,0); return; }
  if(t.dataset.zurueck!==undefined){ ST.auswahl=null; render(); return; }
  if(t.dataset.freigeben){
    const [fid]=t.dataset.freigeben.split("|");
    const f=fall(fid);
    f.log.forEach(l=>{ if(l.art==="freigabe-noetig") l.art="freigegeben"; });
    f.log.push({min:0, akteur:"verwalter", art:"freigegeben", txt:"Freigabe erteilt."});
    f.log.push({min:0, akteur:"agent", art:"auto", txt:"Vertrag versendet. Wartet auf unterschriebene Rückgabe."});
    f.status="abgeschlossen"; f.tageBisVermietung=f.tageBisVermietung||14;
    render();
    return;
  }
  if(t.dataset.bestaetigen){
    const f=fall(ST.auswahl);
    const k=f.kandidaten.find(x=>x.name===t.dataset.bestaetigen);
    if(k){ k.terminStatus="bestaetigt"; f.log.unshift({min:0, akteur:"agent", art:"auto", txt:"Termin mit "+k.name+" bestätigt: "+k.termin+"."}); }
    render();
    return;
  }
});
document.addEventListener("change", e=>{
  if(e.target.matches("select[data-autonomie]")){
    const f=fall(e.target.dataset.autonomie);
    f.autonomie=e.target.value;
    render();
  }
});
let resizeTimer;
window.addEventListener("resize", ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(render,120); });

render();
</script>
