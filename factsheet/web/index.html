<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verkaufsunterlagen · Schaeppi</title>
  <link rel="icon" href="assets/logo/schaeppi-2zeilig-blau.png">
  <link rel="stylesheet" href="web/styles.css">
  <script type="importmap">{ "imports": { "docx": "./vendor/docx.mjs" } }</script>
  <script src="vendor/exceljs.min.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Objekte">
      <div class="brand">
        <img src="assets/logo/schaeppi-2zeilig-weiss.png" alt="Schaeppi Grundstücke">
        <span>Verkaufsunterlagen</span>
      </div>
      <button type="button" class="btn primary block" data-action="new">+ Neues Objekt</button>
      <input type="search" id="search" class="search" placeholder="Objekte durchsuchen" aria-label="Objekte durchsuchen">
      <nav class="objlist" id="objlist"></nav>
      <div class="side-foot">
        <button type="button" class="btn side-btn" data-action="example">Beispiel laden</button>
        <label class="btn side-btn">Importieren<input type="file" id="import" accept=".json,.xlsx" hidden></label>
        <div class="mode" id="mode"></div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="web/app.js"></script>
</body>
</html>
