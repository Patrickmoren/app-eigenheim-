<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factsheet-Generator · Schaeppi</title>
  <link rel="icon" href="/assets/logo/schaeppi-2zeilig-blau.png">
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <header class="top">
    <img class="top-logo" src="/assets/logo/schaeppi-1zeilig-weiss.png" alt="Schaeppi Grundstücke">
    <div class="top-title">Factsheet-Generator</div>
    <div class="top-status" id="status"></div>
    <div class="top-actions">
      <button type="button" class="btn ghost" data-action="new">Neues Objekt</button>
      <button type="button" class="btn ghost" data-action="example">Beispiel laden</button>
      <label class="btn ghost">Projekt öffnen<input type="file" accept="application/json,.json" id="open-file" hidden></label>
      <button type="button" class="btn ghost" data-action="save">Projekt speichern</button>
    </div>
  </header>

  <nav class="steps" id="steps" aria-label="Arbeitsschritte"></nav>

  <main class="layout">
    <section class="panel" id="panel" aria-live="polite"></section>
    <section class="preview">
      <div class="preview-bar">
        <strong>Vorschau</strong>
        <span id="page-info" class="muted"></span>
        <label class="check"><input type="checkbox" id="mark-ai"> KI-Texte markieren</label>
      </div>
      <div class="pages" id="pages"></div>
      <div class="issues" id="issues"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
