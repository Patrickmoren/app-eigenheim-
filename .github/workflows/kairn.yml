name: Kairn Contracts

on:
  push:
    paths: ["krypto/**", ".github/workflows/kairn.yml"]
  pull_request:
    paths: ["krypto/**", ".github/workflows/kairn.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: krypto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: krypto/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run coverage
